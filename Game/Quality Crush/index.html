<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Quality Crush | Quality Week 2026</title>
<style>
:root{color-scheme:dark;--y:#ffb500;--y2:#ffd45c;--line:#3a3a3a;--txt:#fff;--muted:#bdbdbd;--green:#4ad295;--red:#ff6b73}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 85% -10%,#2a2410 0,transparent 40%),radial-gradient(circle at 0 100%,#10202a 0,transparent 45%),linear-gradient(145deg,#050505,#121212);color:var(--txt);font:15px/1.5 Arial,Helvetica,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:auto;padding:14px 12px 36px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}
.logo{height:46px;width:auto;border-radius:4px}
.lab{font-size:11px;letter-spacing:.15em;color:var(--y);font-weight:800}
.btn{min-height:44px;padding:9px 15px;border:1px solid #555;border-radius:10px;background:#232323;color:#fff;font-weight:750;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover:not(:disabled){background:#333}.btn:disabled{opacity:.4;cursor:default}
.primary{background:linear-gradient(180deg,var(--y2),var(--y));border-color:var(--y);color:#111}
.primary:hover:not(:disabled){background:var(--y2)}
.btn:focus-visible,.tile:focus-visible,.node:focus-visible,.pick:focus-visible{outline:3px solid #fff;outline-offset:2px}
h1{font-size:clamp(40px,8vw,78px);line-height:.9;letter-spacing:-.05em;margin:22px 0 12px;text-transform:uppercase}
h1 span,.yellow{color:var(--y)}
h2{font-size:21px;line-height:1.2;margin:0 0 10px}
.muted,small{color:var(--muted)}.small{font-size:12.5px}
.card{background:linear-gradient(145deg,#1e1e1e,#0f0f0f);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 14px 40px #0006}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:26px;align-items:center;margin:16px 0 22px}
.heroArt{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:16px;border-radius:18px;background:#0d0d0d;border:2px solid var(--y);transform:rotate(-2deg);box-shadow:12px 12px 0 #ffb5001a}
.heroArt .gem{position:relative;inset:auto;aspect-ratio:1;width:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.stat{padding:11px 13px;background:#0b0b0b;border:1px solid #333;border-left:4px solid var(--y);border-radius:9px}
.stat b{display:block;font-size:25px;color:var(--y);line-height:1.2}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:9px;margin-top:10px}
.node{position:relative;min-height:64px;border:2px solid #444;border-radius:50% 50% 14px 14px;background:radial-gradient(circle at 40% 30%,#3b3b3b,#151515);color:#fff;font-weight:900;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}
.node small{font-size:11px;color:var(--y);letter-spacing:1px;min-height:14px}
.node .ty{font-size:12px;line-height:1}
.node.done{border-color:var(--y);background:radial-gradient(circle at 40% 30%,#5a4610,#1d1707)}
.node.current{border-color:#fff;box-shadow:0 0 0 4px #ffb50055,0 0 22px #ffb50088;animation:pulse 1.4s infinite alternate}
.node:disabled{opacity:.35;cursor:default}
@keyframes pulse{to{box-shadow:0 0 0 7px #ffb50022,0 0 30px #ffb500aa}}
.game{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start;margin-top:10px}
.hud{display:grid;grid-template-columns:110px 1fr;gap:10px;margin-bottom:10px}
.moves{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:16px;background:linear-gradient(180deg,#2c2c2c,#121212);border:2px solid var(--y)}
.moves b{font-size:42px;line-height:1;color:var(--y)}.moves small{font-size:11px;letter-spacing:.12em;font-weight:800}
.moves.low b{color:var(--red);animation:blink .8s infinite alternate}
@keyframes blink{to{opacity:.5}}
.scorebox{padding:10px 14px;border-radius:16px;background:#111;border:1px solid #333}
.scoreLine{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.scoreLine b{font-size:28px}
.meter{position:relative;height:14px;background:#050505;border:1px solid #444;border-radius:99px;margin:8px 0 2px}
.meter>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff8a00,var(--y),#fff3b0);transition:width .4s}
.meter i{position:absolute;top:50%;transform:translate(-50%,-50%);font-style:normal;font-size:18px;color:#555;text-shadow:0 0 3px #000}
.meter i.on{color:var(--y);text-shadow:0 0 8px var(--y)}
.goals{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.goal{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:99px;background:#1b1b1b;border:1px solid #444;font-weight:800;font-size:13px}
.goal.ok{border-color:var(--green);color:var(--green)}
.goal .mini{width:26px;height:26px;position:relative}
.boardWrap{max-width:max(320px,calc(100vh - 200px));margin:0 auto;padding:10px;border-radius:20px;background:linear-gradient(160deg,#1a1a1a,#0a0a0a);border:2px solid #333;border-top-color:var(--y);box-shadow:inset 0 0 40px #000}
.board{position:relative;width:100%;aspect-ratio:1;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:12px}
.cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
.cell{border:1px solid #ffffff08;background:#ffffff07}
.cell:nth-child(odd){background:#ffffff0d}
.cell.j1{background:radial-gradient(circle at 30% 30%,#7dffb355,#1f7a4a88);box-shadow:inset 0 0 0 2px #5fd38d66}
.cell.j2{background:radial-gradient(circle at 30% 30%,#7dffb399,#0f5a32cc);box-shadow:inset 0 0 0 3px #5fd38dcc}
.tiles,.fx{position:absolute;inset:0}
.fx{pointer-events:none;z-index:4}
/* Contamination : calque AU-DESSUS des implants pour rester visible */
.jellies{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);pointer-events:none;z-index:2}
.jcell{position:relative;border-radius:9px;margin:1px}
.jcell.j1{box-shadow:inset 0 0 0 3px #39ff88,inset 0 0 12px 2px #39ff88aa;background:repeating-linear-gradient(135deg,#39ff8830 0 5px,transparent 5px 11px)}
.jcell.j2{box-shadow:inset 0 0 0 4px #00e070,inset 0 0 0 7px #0b3d22,inset 0 0 18px 6px #39ff88cc;background:repeating-linear-gradient(135deg,#39ff8855 0 5px,transparent 5px 10px)}
.jcell.j1::after,.jcell.j2::after{content:"✚";position:absolute;left:2px;bottom:1px;min-width:17px;height:17px;padding:0 2px;border-radius:5px;background:#0f7a3c;color:#fff;font:900 11px/17px Arial,sans-serif;text-align:center;box-shadow:0 1px 3px #000}
.jcell.j2::after{content:"✚✚";background:#064d24}
.jcell.clean{animation:cleanFx .55s ease-out}
@keyframes cleanFx{0%{box-shadow:inset 0 0 0 4px #fff,0 0 22px 8px #39ff88;background:#ffffff66}100%{box-shadow:none;background:transparent}}
.objBanner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 auto 10px;max-width:max(320px,calc(100vh - 200px));padding:10px 14px;border-radius:14px;background:linear-gradient(90deg,#2a220b,#141414);border:2px solid var(--y);box-shadow:0 0 18px #ffb50033}
.objBanner .ob-ico{font-size:30px;line-height:1;color:var(--y);min-width:34px;text-align:center}
.objBanner .ob-txt{flex:1 1 160px;font-weight:850;font-size:15px}
.objBanner .ob-txt small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.objBanner .ob-items{display:flex;gap:8px;flex-wrap:wrap}
.obItem{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:#000;border:2px solid #555;font-weight:950;font-size:20px}
.obItem .mini{width:30px;height:30px;position:relative}
.obItem.ok{border-color:var(--green);color:var(--green)}
.obItem.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.25);background:#ffb50055}}
.objBanner.done{border-color:var(--green);background:linear-gradient(90deg,#0f2a1a,#141414)}
.obSwatch{display:inline-block;width:22px;height:22px;border-radius:6px;vertical-align:middle;box-shadow:inset 0 0 0 3px #39ff88,inset 0 0 8px #39ff88;background:repeating-linear-gradient(135deg,#39ff8840 0 4px,transparent 4px 8px)}
.bonusBar{position:absolute;left:4%;right:4%;top:4%;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:14px;background:#000e;border:2px solid var(--y);box-shadow:0 8px 30px #000;animation:appear .3s}
.bonusBar b{color:var(--y);font-size:16px}.bonusBar span{font-size:13px;color:#ddd}
.intro{text-align:center}
.intro .bigIco{font-size:64px;line-height:1;color:var(--y)}
.intro .objLine{font-size:22px;font-weight:950;margin:8px 0}
.intro .explain{background:#0c0c0c;border:1px solid #444;border-radius:10px;padding:12px;text-align:left;margin:12px 0}
.wordReady{animation:glowW 1s infinite alternate}
@keyframes glowW{to{box-shadow:0 0 0 4px #ffb50066,0 0 24px #ffb500}}
.flyLetter{position:fixed;z-index:500;width:30px;height:34px;border-radius:7px;background:var(--y);color:#000;display:grid;place-items:center;font:950 20px Arial,sans-serif;border:2px solid #fff;box-shadow:0 4px 14px #000;pointer-events:none}
.tile{position:absolute;left:0;top:0;width:12.5%;height:12.5%;padding:3px;border:0;background:none;transform:translate(calc(var(--x)*100%),calc(var(--y)*100%));transition:transform .26s cubic-bezier(.3,.2,.35,1.25)}
.tile.nofx{transition:none}
.gem{position:absolute;inset:3px;border-radius:30%;display:grid;place-items:center;color:var(--c);background:radial-gradient(circle at 32% 25%,#ffffffd0 0 8%,transparent 30%),radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--c) 70%,#fff 0%),color-mix(in srgb,var(--c) 45%,#000) 95%);box-shadow:inset 0 -4px 6px #0006,inset 0 3px 4px #fff5,0 3px 5px #000a;transition:transform .15s}
.gem svg{width:78%;height:78%;color:#fff;filter:drop-shadow(0 1px 1px #0008)}
.tile:hover .gem{transform:scale(1.05)}
.tile.sel .gem{transform:scale(.86);box-shadow:0 0 0 3px #fff,0 0 18px #fff}
.tile.hint .gem{animation:wiggle .9s infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg) scale(1.06)}75%{transform:rotate(9deg) scale(1.06)}}
.tile.appear .gem{animation:appear .3s}
@keyframes appear{from{transform:scale(0)}}
.tile.pop{z-index:3;pointer-events:none}
.tile.pop .gem{animation:pop .28s forwards}
@keyframes pop{40%{transform:scale(1.3);filter:brightness(2)}100%{transform:scale(0);opacity:0}}
.tile.shake .gem{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-12%)}75%{transform:translateX(12%)}}
.sp-h .gem::after,.sp-v .gem::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(var(--a),#ffffffcc 0 3px,transparent 3px 9px);mix-blend-mode:overlay;opacity:.95}
.sp-h .gem{--a:0deg}.sp-v .gem{--a:90deg}
.sp-h .gem::before,.sp-v .gem::before{content:"";position:absolute;inset:-2px;border-radius:inherit;border:2px solid #fff}
.sp-wrap .gem{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c),0 0 16px var(--c);animation:breathe 1s infinite alternate}
@keyframes breathe{to{transform:scale(.9)}}
.sp-color .gem{background:conic-gradient(from 0deg,#ff5e5e,#ffb500,#fff36b,#5fd38d,#4f9dff,#b98bea,#ff5e5e);box-shadow:0 0 14px #fff,inset 0 0 10px #0008;border-radius:50%;animation:spin 3s linear infinite}
.sp-color .gem svg{display:none}
.sp-color .gem::after{content:"★";color:#fff;font-size:min(5vw,30px);text-shadow:0 0 6px #000}
@keyframes spin{to{filter:hue-rotate(360deg)}}
.locked .gem::after{content:"";position:absolute;inset:-3px;border-radius:24%;background:repeating-linear-gradient(45deg,transparent 0 7px,#ffffffaa 7px 9px),repeating-linear-gradient(-45deg,transparent 0 7px,#ffffffaa 7px 9px);border:3px solid #d0d6da;box-shadow:inset 0 0 8px #000}
.lockTag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;width:46%;height:46%;display:grid;place-items:center;border-radius:8px;background:#f1f3f5;border:2px solid #212529;box-shadow:0 2px 6px #000a}.lockTag svg{width:80%;height:80%}
.letter{position:absolute;right:-1px;top:-1px;z-index:3;min-width:27px;height:27px;padding:0 4px;border:2px solid #000;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7d1,#ffb500 60%);color:#000;display:grid;place-items:center;font-size:17px;font-weight:950;box-shadow:0 0 0 2px #fff,0 0 12px 3px #ffb500;animation:letterPulse 1.1s ease-in-out infinite alternate}
@keyframes letterPulse{to{box-shadow:0 0 0 2px #fff,0 0 18px 6px #ffb500;transform:scale(1.08)}}
.beam{position:absolute;background:linear-gradient(var(--d),transparent,#fff,var(--y),#fff,transparent);animation:beam .4s ease-out forwards}
.beam.h{left:0;right:0;height:12.5%;--d:0deg}
.beam.v{top:0;bottom:0;width:12.5%;--d:90deg;animation-name:beamv}
@keyframes beam{from{opacity:1;transform:scale(1,.2)}50%{transform:scale(1,1)}to{opacity:0;transform:scale(1,1.2)}}
@keyframes beamv{from{opacity:1;transform:scale(.2,1)}50%{transform:scale(1,1)}to{opacity:0;transform:scale(1.2,1)}}
.boom{position:absolute;border-radius:50%;border:4px solid var(--y);background:radial-gradient(circle,#fff8,transparent 70%);animation:boom .45s ease-out forwards}
@keyframes boom{from{transform:scale(.2);opacity:1}to{transform:scale(1);opacity:0}}
.spark{position:absolute;width:12.5%;height:12.5%;background:radial-gradient(circle,#fff,#ffb50088 40%,transparent 70%);animation:boom .5s ease-out forwards}
.float{position:absolute;transform:translate(-50%,-50%);font-weight:950;font-size:clamp(16px,2.6vw,24px);color:#fff;text-shadow:0 2px 0 #000,0 0 10px var(--y);animation:floatUp .9s ease-out forwards;white-space:nowrap}
@keyframes floatUp{to{transform:translate(-50%,-160%);opacity:0}}
.praise{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:clamp(30px,7vw,60px);font-weight:950;letter-spacing:-.03em;color:var(--y);-webkit-text-stroke:2px #000;text-shadow:0 5px 0 #000,0 0 30px #ffb500;animation:praise 1.1s ease-out forwards;white-space:nowrap;z-index:5}
@keyframes praise{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}70%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.message{min-height:44px;padding:10px 12px;margin-top:10px;background:#141414;border-left:4px solid var(--y);border-radius:8px}
.stack{display:grid;gap:12px}
.puzzle{border-color:#6b5310;background:linear-gradient(145deg,#2a220b,#111)}
.puzzle strong{color:var(--y);font-size:12px;letter-spacing:.08em}
.slots{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}
.slot{width:30px;height:36px;border:1px solid #888;border-radius:6px;display:grid;place-items:center;font-size:20px;font-weight:900;background:#0008}
.slot.filled{background:var(--y);border-color:var(--y);color:#000;animation:slotPop .3s}
@keyframes slotPop{50%{transform:scale(1.25)}}
.picks{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.pick{width:42px;height:46px;border-radius:8px;border:2px solid #fff;background:var(--y);color:#000;font-size:22px;font-weight:950}
.pick:disabled{opacity:.2}
.legend{display:grid;gap:7px}
.legend div{display:flex;gap:9px;align-items:center;font-size:12.5px}
.legend .tile,dialog .tile{position:relative;display:inline-block;transform:none;width:40px;height:40px;flex-shrink:0;transition:none}
dialog{width:calc(100% - 28px);max-width:560px;max-height:90dvh;overflow:auto;background:#181818;color:#fff;border:2px solid var(--y);border-radius:16px;padding:22px;box-shadow:0 30px 100px #000}
dialog::backdrop{background:#000d;backdrop-filter:blur(4px)}
dialog li{margin-bottom:6px}
.bigstars{font-size:52px;color:var(--y);letter-spacing:6px;text-align:center;line-height:1.1}
.bigstars .off{color:#444}
.answer{background:#0c0c0c;border:1px solid #555;border-left:5px solid var(--y);padding:13px;border-radius:8px;margin:10px 0}
.answer.wrong{border-left-color:var(--red)}.answer.correct{border-left-color:var(--green)}
.reveal{font-size:28px;font-weight:950;color:var(--y);letter-spacing:.08em}
.save{min-height:22px;font-weight:700;color:var(--y)}.save.err{color:var(--red)}
.notice{border-left:3px solid var(--y);padding-left:11px;color:#999;font-size:11px;margin-top:22px}
.skip{position:absolute;top:-100px;left:8px;background:var(--y);color:#000;padding:10px;z-index:300}.skip:focus{top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
table{border-collapse:collapse;width:100%;font-size:13px}td{padding:6px;border-bottom:1px solid #333;vertical-align:middle}
.confetti{position:fixed;z-index:200;pointer-events:none;width:9px;height:14px;animation:confetti 1.1s ease-out forwards}
@keyframes confetti{to{transform:translate(var(--dx),var(--dy)) rotate(560deg);opacity:0}}
@media(max-width:860px){.game{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.heroArt{max-width:340px;margin:auto}.stack{order:-1}.legendCard{display:none}}
@media(max-width:520px){.hud{grid-template-columns:86px 1fr}.moves b{font-size:32px}.scoreLine b{font-size:22px}.letter{min-width:22px;height:22px;font-size:14px;right:-3px;top:-3px}.objBanner .ob-txt{font-size:13px}.obItem{font-size:16px}.boardWrap{padding:5px}.logo{height:36px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>

/* ---------- Effets visuels ---------- */
const pct = v => (v * 12.5) + "%";
function addFx(cls, style, ms = 600, text = "") { const d = document.createElement("div"); d.className = cls; Object.assign(d.style, style); if (text) d.textContent = text; fxEl.append(d); setTimeout(() => d.remove(), ms); return d; }
function playEffects(effects) {
  for (const e of effects) {
    if (e.type === "h") addFx("beam h", { top: pct(e.r) });
    else if (e.type === "v") addFx("beam v", { left: pct(e.c) });
    else if (e.type === "wrap") { const s = (e.rad * 2 + 1); addFx("boom", { left: pct(e.c - e.rad), top: pct(e.r - e.rad), width: pct(s), height: pct(s) }); }
    else if (e.type === "color") (e.cells || []).slice(0, 64).forEach(i => { const [r, c] = rc(i); addFx("spark", { left: pct(c), top: pct(r) }); });
  }
  if (effects.length) beep(220, .25, "sawtooth", .04);
}
function floatText(cells, text) {
  if (!cells.length) return;
  let r = 0, c = 0; cells.forEach(i => { const [a, b] = rc(i); r += a; c += b; }); r /= cells.length; c /= cells.length;
  addFx("float", { left: ((c + .5) * 12.5) + "%", top: ((r + .5) * 12.5) + "%" }, 950, text);
}
function praise(text) { if (!text) return; addFx("praise", {}, 1150, text); live.textContent = text; }

/* ---------- Déroulement d'un coup ---------- */
async function resolveAnimated(plan, speed = 1) {
  let chain = 0;
  while (true) {
    if (!plan) { const rs = runs(S); if (!rs.length) break; plan = planMatches(S, groupRuns(rs)); }
    chain++;
    if (plan.bonus) S.score += plan.bonus;
    const res = applyClear(S, plan, chain); plan = null;
    playEffects(res.effects);
    floatText(res.removed.map(x => x.i).concat(res.unlocked), "+" + fmt(res.gained));
    if (chain >= 2) praise(PRAISE[Math.min(chain, PRAISE.length - 1)]);
    for (const c of res.created) say(t("created", { x: SPECIAL_NAME[c.tile.special] }));
    if (res.letters.length) { flyLetters(res.removed); word.found.push(...res.letters); updateWord(); beep(990, .12, "triangle"); if (wordComplete()) say(t("allLetters")); }
    chime(chain);
    renderBoard(); updateHud();
    await wait(230 * speed);
    S.grid.forEach(tt => { if (tt) tt.fired = false; });
    const spawned = gravity(S);
    renderBoard(spawned);
    await wait(290 * speed);
  }
}
async function doSwap(a, b) {
  if (busy || ended || screen !== "game" || a === b) return;
  if (!adjacent(a, b)) return;
  if (!canMove(S, a, b)) { [a, b].forEach(i => { const tt = S.grid[i]; const el = tt && els.get(tt.id); if (el) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); } }); say(t("lockMsg")); return; }
  busy = true; clearHint(); sel = null; updateWord();
  swapCells(S, a, b); renderBoard(); beep(400, .06);
  await wait(200);
  const plan = swapPlan(S, a, b);
  if (!plan) {
    swapCells(S, a, b); renderBoard(); say(t("noMatch"));
    await wait(220); busy = false; updateWord(); scheduleHint(); return;
  }
  S.moves--; updateHud();
  await resolveAnimated(plan);
  await afterTurn();
}
async function afterTurn() {
  if (objectiveDone(S)) { await winSequence(); return; }
  if (S.moves <= 0) {
    await maybeAskWord();
    if (S.moves > 0) { say(t("extraMoves")); busy = false; updateHud(); updateWord(); scheduleHint(); return; }
    ended = true; busy = false; updateHud(); updateWord(); endLevel(false); return;
  }
  if (!findMove(S)) { say(t("shuffle")); shuffleBoard(S); renderBoard(); await wait(350); }
  busy = false; updateHud(); updateWord(); scheduleHint();
}
async function winSequence() {
  busy = true; clearHint();
  await maybeAskWord();            // le mot peut encore être proposé avant la clôture
  ended = true; updateWord(); updateHud();
  praise(t("crush")); beep(660, .2, "triangle"); setTimeout(() => beep(880, .3, "triangle"), 150);
  if (S.moves > 0) {
    skipBonus = false;
    const bar = document.createElement("div"); bar.className = "bonusBar"; bar.id = "bonusBar";
    bar.innerHTML = `<div><b>${t("bonusTitle")}</b><br><span>${t("bonusSub")}</span></div><button class="btn primary" type="button" data-action="skipBonus">${t("skip")}</button>`;
    boardEl.append(bar);
    await wait(900);
    const fast = S.moves > 8 ? .45 : .7;
    while (S.moves > 0 && !skipBonus) {
      S.moves--; S.score += 100; updateHud();
      const i = pickBonusCell(S);
      if (i >= 0) { S.grid[i].special = Math.random() < .5 ? "h" : "v"; renderBoard(); await wait(140 * fast); await resolveAnimated({ clear: new Set([i]), creates: [], effects: [] }, fast); }
    }
    if (S.moves > 0) { crushBonusSync(S); S.grid.forEach(tt => { if (tt) tt.fired = false; }); renderBoard(); }
    bar.remove();
  } else await wait(700);
  busy = false; updateHud();
  endLevel(true);
}

/* ---------- Indice automatique ---------- */
function clearHint() { clearTimeout(hintTimer); if (hintCells.length) { hintCells = []; if (screen === "game") renderBoard(); } }
function scheduleHint() { clearTimeout(hintTimer); hintTimer = setTimeout(() => { if (busy || ended || screen !== "game" || modal.open) return; const m = findMove(S); if (m) { hintCells = m; renderBoard(); } }, 6000); }

/* ---------- Saisie : clic, glisser, clavier ---------- */
let drag = null, suppressClick = 0;
function bindBoard() {
  boardEl.addEventListener("pointerdown", e => {
    const tt = e.target.closest(".tile"); if (!tt || tt.dataset.index === undefined || busy || ended) return;
    drag = { i: +tt.dataset.index, x: e.clientX, y: e.clientY, done: false };
  });
  boardEl.addEventListener("pointermove", e => {
    if (!drag || drag.done) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 16) return;
    drag.done = true; suppressClick = Date.now() + 350;
    const [r, c] = rc(drag.i);
    const [nr, nc] = Math.abs(dx) > Math.abs(dy) ? [r, c + Math.sign(dx)] : [r + Math.sign(dy), c];
    if (inside(nr, nc)) doSwap(drag.i, idx(nr, nc));
  });
  const end = () => { drag = null; };
  boardEl.addEventListener("pointerup", end); boardEl.addEventListener("pointercancel", end); boardEl.addEventListener("pointerleave", end);
  boardEl.addEventListener("click", e => {
    const tt = e.target.closest(".tile"); if (!tt || tt.dataset.index === undefined) return;
    if (Date.now() < suppressClick || busy || ended) return;
    const i = +tt.dataset.index; clearHint();
    if (sel === null) sel = i;
    else if (sel === i) sel = null;
    else if (adjacent(sel, i)) { const a = sel; sel = null; doSwap(a, i); return; }
    else sel = i;
    renderBoard(); scheduleHint();
  });
  boardEl.addEventListener("keydown", e => {
    const tt = e.target.closest(".tile"); if (!tt || tt.dataset.index === undefined) return;
    const o = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[e.key];
    if (e.key === "Escape") { sel = null; renderBoard(); return; }
    if (!o) return;
    e.preventDefault();
    const [r, c] = rc(+tt.dataset.index), nr = r + o[0], nc = c + o[1];
    if (!inside(nr, nc)) return;
    if (sel === +tt.dataset.index && !busy) { const a = sel; sel = null; doSwap(a, idx(nr, nc)); return; }
    const u = S.grid[idx(nr, nc)], el = u && els.get(u.id); if (el) el.focus();
  });
}

/* ---------- Mot mystère ---------- */
function openWord() {
  if (!word || word.solved !== null || word.found.length < word.chars.length) return;
  clearHint(); word.entry = [];
  renderWordModal();
}
function renderWordModal() {
  const used = new Set(word.entry);
  openModal(t("wordTitle"), `<p>${QO}${esc(word.item.c)}${QC}</p>
    <div class="slots">${word.chars.map((_, i) => `<span class="slot ${i < word.entry.length ? "filled" : ""}">${i < word.entry.length ? esc(word.found[word.entry[i]].ch) : "?"}</span>`).join("")}</div>
    <div class="picks">${word.found.map((l, k) => `<button class="pick" type="button" data-action="pick" data-k="${k}" ${used.has(k) ? "disabled" : ""} aria-label="${t("letterAria", { l: esc(l.ch) })}">${esc(l.ch)}</button>`).join("")}</div>
    ${asking ? `<p class="yellow"><b>${t("lastChance")}</b></p>` : ""}<p class="small muted">${t("oneTry")}</p>
    <div class="row"><button class="btn primary" type="button" data-action="checkWord" ${word.entry.length !== word.chars.length ? "disabled" : ""}>${t("check")}</button><button class="btn" type="button" data-action="erase" ${word.entry.length ? "" : "disabled"}>${t("erase")}</button><button class="btn" type="button" data-action="close">${asking ? t("skipWord") : t("later")}</button></div>`, "word");
}
function checkWord() {
  const guess = word.entry.map(k => word.found[k].ch).join(""), ok = guess === word.item.w;
  word.solved = ok;
  if (ok) { P.words++; saveLocal(); if (!ended) { S.moves += 3; S.score += 1000; } confetti(); beep(990, .3, "triangle"); }
  updateHud(); updateWord();
  openModal(ok ? t("okTitle") : t("koTitle"), `<div class="answer ${ok ? "correct" : "wrong"}"><p><strong>${t("clue")}</strong>${SEP}${QO}${esc(word.item.c)}${QC}</p><p><strong>${t("expected")}</strong></p><div class="reveal">${esc(word.item.w)}</div><p>${esc(word.item.m)}</p>${ok ? `<p class="yellow"><b>${t("okBonus")}</b></p>` : `<p class="muted">${t("yourGuess", { g: esc(guess) })}</p>`}</div><button class="btn primary" type="button" data-action="close">${t("resume")}</button>`, "answer");
}

/* ---------- Fin de niveau ---------- */
function endLevel(win) {
  clearHint();
  const st = starsFor(S.score, win), n = def.n;
  const before = hubPoints();
  if (win) {
    P.level = Math.max(P.level, Math.min(MAX_LEVEL, n + 1));
    if (S.score > (Number(P.best[n]) || 0)) P.best[n] = S.score;
    P.stars[n] = Math.max(Number(P.stars[n]) || 0, st);
    saveLocal();
  }
  const improved = hubPoints() > before || (remoteBest !== null && remoteBest < hubPoints());
  const stars = win ? `<div class="bigstars">${[1, 2, 3].map(k => `<span class="${k <= st ? "" : "off"}">★</span>`).join("")}</div>` : `<div class="bigstars"><span class="off">✖</span></div>`;
  const wordInfo = word && word.solved === null ? `<div class="answer"><p class="small"><strong>${t("wasWord")}</strong>${SEP}<span class="yellow"><b>${esc(word.item.w)}</b></span> — ${esc(word.item.m)}</p></div>` : "";
  openModal(win ? t("winTitle") : t("loseTitle"), `${stars}
    <h2 style="text-align:center">${t("pts", { n: fmt(S.score) })}</h2>
    <p style="text-align:center" class="muted">${win ? t("winInfo", { b: fmt(P.best[n]), h: fmt(hubPoints()) }) : esc(t("loseInfo", { obj: objectiveText(def) }))}</p>
    ${wordInfo}
    <p class="save" id="saveStatus" role="status">${win && improved ? t("saving") : ""}</p>
    <div class="row" style="justify-content:center">${win && n < MAX_LEVEL ? `<button class="btn primary" type="button" data-action="next">${t("next")}</button>` : ""}<button class="btn ${win ? "" : "primary"}" type="button" data-action="restart">${t("replayU")}</button><button class="btn" type="button" data-action="home">${t("mapU")}</button></div>`, "result");
  if (win) { confetti(); if (improved) saveRemote(); }
}
async function saveRemote() {
  const el = () => document.getElementById("saveStatus");
  if (!scores) { if (el()) { el().textContent = t("saveNA"); el().classList.add("err"); } return; }
  saving = true;
  try {
    const saved = await scores.saveBestScore(hubPoints());
    remoteBest = saved;
    if (el()) { el().classList.remove("err"); el().textContent = t("saved", { n: fmt(saved) }); }
  } catch (e) {
    console.error(e);
    if (el()) { el().classList.add("err"); el().textContent = t("saveErr"); }
  } finally { saving = false; }
}

/* ---------- Fenêtres ---------- */
let prevFocus = null;
function openModal(title, body, kind) {
  if (!modal.open) prevFocus = document.activeElement;
  modal.dataset.kind = kind;
  modal.innerHTML = `<h2 id="modalTitle">${esc(title)}</h2>${body}`;
  if (!modal.open) modal.showModal();
  (modal.querySelector(".primary:not(:disabled)") || modal.querySelector("button:not(:disabled)"))?.focus();
}
function closeModal() { if (modal.open) modal.close(); if (prevFocus && prevFocus.isConnected) prevFocus.focus(); prevFocus = null; if (screen === "game" && !busy && !ended) scheduleHint(); }
modal.addEventListener("cancel", e => { if (modal.dataset.kind === "result") e.preventDefault(); });
modal.addEventListener("close", () => { if (wordResolve) { const r = wordResolve; wordResolve = null; r(); } });
function help() {
  openModal(t("helpTitle"), `<ul><li>${t("help1")}</li><li>${t("help2")}</li><li>${t("help3")}</li><li>${t("help4")}</li><li>${t("help5")}</li></ul>
  <table>
    <tr><td>${legendTile(0, "h")}</td><td>${t("hAudit")}</td></tr>
    <tr><td>${legendTile(2, "wrap")}</td><td>${t("hBomb")}</td></tr>
    <tr><td>${legendTile(-1, "color")}</td><td>${t("hGold")}</td></tr>
    <tr><td>${t("hCombosT")}</td><td>${t("hCombos")}</td></tr>
  </table>
  <p style="margin-top:12px"><button class="btn primary" type="button" data-action="close">${t("gotIt")}</button></p>`, "help");
}

/* ---------- Actions ---------- */
function afterTurnIdle() { if (asking || busy) return; if (S && S.moves > 0 && objectiveDone(S) && !ended) winSequence(); else scheduleHint(); }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-action]"); if (!b || b.disabled) return;
  const a = b.dataset.action;
  if (a === "sound") { sound = !sound; try { localStorage.setItem("quality-crush-sound", sound ? "1" : "0"); } catch { /* rien */ } b.textContent = sound ? t("soundOn") : t("soundOff"); beep(660); return; }
  if (a === "help") { help(); return; }
  if (a === "skipBonus") { skipBonus = true; b.disabled = true; return; }
  if (a === "close") { const k = modal.dataset.kind; closeModal(); if (k === "answer" && screen === "game" && !ended) afterTurnIdle(); return; }
  if (a === "pick") { if (word.entry.length < word.chars.length) word.entry.push(+b.dataset.k); renderWordModal(); return; }
  if (a === "erase") { word.entry.pop(); renderWordModal(); return; }
  if (a === "checkWord") { checkWord(); return; }
  if (a === "word") { if (!busy) openWord(); return; }
  if (a === "level") { startLevel(+b.dataset.level); return; }
  if (a === "next") { startLevel(def.n + 1); return; }
  if (a === "restart") { if (busy && !ended) return; if (screen === "game" && !ended && !confirm(t("confirmRestart"))) return; startLevel(def.n); return; }
  if (a === "home") { if (busy && !ended) return; if (screen === "game" && !ended && !confirm(t("confirmQuit"))) return; closeModal(); renderHome(); return; }
  if (a === "reset") { if (confirm(t("confirmReset"))) { P = { level: 1, best: {}, stars: {}, words: 0, recent: [] }; saveLocal(); renderHome(); } }
});
window.addEventListener("beforeunload", e => { if ((screen === "game" && !ended && S && S.moves < def.moves) || saving) { e.preventDefault(); e.returnValue = ""; } });

renderHome();
window.addEventListener("DOMContentLoaded", async () => {
  if (!window.QWScores) { app.insertAdjacentHTML("afterbegin", `<p class="message">${t("noService")}</p>`); return; }
  const r = await window.QWScores.boot("quality-crush");
  if (!r) return;
  scores = r.scores; remoteBest = r.best;
  if (remoteBest < hubPoints()) { try { remoteBest = await scores.saveBestScore(hubPoints()); } catch (e) { console.warn(e); } }
  if (screen === "home") renderHome();
}, { once: true });
})();
</script>
