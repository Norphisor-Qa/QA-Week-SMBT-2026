<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090b">
<title>Scénarios qualité | Quality Week 2026</title>
<style>
:root{color-scheme:dark;--bg:#09090b;--panel:#18181b;--border:#3f3f46;--text:#f4f4f5;--muted:#a1a1aa;--yellow:#ffb500;--green:#4ade80;--red:#fb7185}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.55 Arial,Helvetica,sans-serif}
main{max-width:1100px;margin:auto;padding:16px 14px 40px}
h1{font-size:clamp(34px,7vw,60px);line-height:1;letter-spacing:-.05em;margin:18px 0 8px}
h2{font-size:22px;line-height:1.25;margin:0 0 12px}h3{margin:0 0 10px}p{margin:0 0 12px}
button,select{font:inherit}
.btn{min-height:46px;border:1px solid #52525b;border-radius:12px;background:#18181b;color:var(--text);padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700}
.btn:hover:not(:disabled){background:#27272a}.btn:disabled{opacity:.4;cursor:default}
.primary{background:var(--yellow);border-color:var(--yellow);color:#111;font-weight:850}.primary:hover:not(:disabled){background:#fef08a}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}
.brand{color:var(--yellow);font-size:11px;letter-spacing:.15em;font-weight:800}
.muted{color:var(--muted)}.small{font-size:13px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px}
.tag{background:#27272a;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:700}
select{background:#27272a;color:var(--text);border:1px solid #52525b;border-radius:10px;padding:10px;min-height:46px}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
.caseCard{text-align:left;align-items:flex-start;flex-direction:column;min-height:120px;padding:14px;border-radius:14px}
.caseCard b{font-size:15px}.caseCard .st{color:var(--yellow);letter-spacing:3px;font-size:18px}
.hudbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.sceneWrap{position:relative;border-radius:18px;overflow:hidden;border:2px solid #3f3f46;background:#1b1d22}
svg.scene{display:block;width:100%;height:auto}
.objList{display:none}
@media(max-width:720px){
  main{padding:8px 8px 30px}
  h1{font-size:36px;margin:8px 0 4px}
  .hudbar .tag:nth-child(3){display:none}
  .sceneHint{display:block!important}
  .bubble{font-size:13.5px;padding:8px 10px}
  .objList{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
  .objList .btn{min-height:46px;justify-content:flex-start;text-align:left;font-size:14px;padding:8px 10px}
  .objList .btn.ev{border-color:var(--yellow)}
  .objList .btn.done{border-color:var(--green);color:var(--green)}
  .inventory{gap:6px}.slot{min-height:64px;padding:8px}
  .cases{grid-template-columns:1fr 1fr;gap:8px}.caseCard{min-height:100px;padding:10px}
}
.sceneHint{display:none;font-size:12px;color:var(--muted);margin:4px 0}
.hs{cursor:pointer}
.hs .outline{fill:transparent;stroke:transparent;stroke-width:4}
.hs:hover .outline,.hs:focus-visible .outline{stroke:var(--yellow);fill:#ffb50022}
.hs:focus{outline:none}
.hs .marker{animation:bob 1.3s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px)}}
.hs.locked{cursor:not-allowed}
.bubble{margin:0 0 10px;background:#000;border:1px solid var(--yellow);border-radius:14px;padding:10px 14px;font-size:14.5px}
.bubble b{color:var(--yellow)}
.inventory{display:grid;grid-template-columns:repeat(3,1fr) 1.2fr;gap:10px;margin-top:12px}
.slot{min-height:84px;border:2px dashed #52525b;border-radius:14px;padding:10px;font-size:13px;display:flex;flex-direction:column;justify-content:center;background:#121214;text-align:left;color:var(--text)}
.slot.filled{border-style:solid;border-color:var(--yellow);background:#1f1d10;cursor:pointer}
.slot .v{font-weight:850;color:var(--yellow)}
.slot.door{border-style:solid;border-color:#52525b;font-weight:800;align-items:center;text-align:center;cursor:pointer}
.slot.door.ready{border-color:var(--green);background:#0f2a1a;animation:glow 1.2s infinite alternate}
@keyframes glow{to{box-shadow:0 0 18px #4ade8066}}
dialog{width:calc(100% - 24px);max-width:720px;max-height:92dvh;overflow:auto;background:#18181b;color:var(--text);border:2px solid var(--yellow);border-radius:18px;padding:20px}
dialog::backdrop{background:#000c;backdrop-filter:blur(3px)}
.paper{position:relative;background:#f5f1e6;color:#18181b;border-radius:6px;padding:22px 22px 18px;box-shadow:0 10px 30px #000a;font-family:"Courier New",monospace;font-size:16.5px;line-height:1.9;background-image:repeating-linear-gradient(#f5f1e6 0 30px,#e6dfcc 30px 31px)}
.paper .head{display:flex;justify-content:space-between;gap:10px;font:800 12px/1.3 system-ui,sans-serif;letter-spacing:.06em;border-bottom:2px solid #18181b;padding-bottom:6px;margin-bottom:10px;text-transform:uppercase}
.paper .stamp{position:absolute;right:16px;bottom:10px;transform:rotate(-8deg);border:3px solid #b91c1c;color:#b91c1c;font:900 13px system-ui;padding:2px 8px;border-radius:6px;opacity:.75}
.zone{font:inherit;font-weight:800;color:#0b3d91;background:#dbeafe;border:2px dashed #3b82f6;border-radius:6px;padding:0 4px;cursor:zoom-in;line-height:1.5}
.zone:hover{background:#bfdbfe}
.zone.marked{background:#fee2e2;color:#7f1d1d;border:3px solid #dc2626;border-radius:40%;box-shadow:0 0 0 2px #fca5a5}
.zone.good{background:#dcfce7;color:#14532d;border:3px solid #16a34a}
.zone.bad{background:#fee2e2;color:#7f1d1d;border:3px solid #dc2626;text-decoration:line-through}
.zone.missed{background:#fef9c3;border:3px dashed #ca8a04;color:#713f12}
.verdicts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.verdicts .btn{flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;gap:0}
.verdicts .btn.on{background:var(--yellow);color:#111;border-color:var(--yellow)}
.verdicts small{display:block;font-weight:500;font-size:12px;opacity:.85}
.hint{background:#2a2410;border-left:4px solid var(--yellow);border-radius:8px;padding:8px 12px;font-weight:700;margin:12px 0 0}
.why{background:#111827;border-left:4px solid var(--yellow);border-radius:8px;padding:10px 12px;margin:10px 0 0;font-size:15px}
.choice{display:block;width:100%;text-align:left;margin-top:8px;justify-content:flex-start}
.choice.on{background:var(--yellow);color:#111;border-color:var(--yellow)}
.stars{color:var(--yellow);font-size:44px;letter-spacing:6px;text-align:center}
.score{font-size:34px;font-weight:900;text-align:center;margin:0}
.ok{color:var(--green)}.ko{color:var(--red)}
.save{font-weight:800;color:var(--yellow);text-align:center}.save.err{color:var(--red)}
.qwLogo{height:42px;width:auto;border-radius:4px}
@media(max-width:520px){.qwLogo{height:32px}}
.caseCard.locked{opacity:.55;cursor:not-allowed;border-style:dashed}
.caseCard .lockIco{font-size:22px}
.unlockInfo{margin-top:10px;font-weight:700;color:var(--yellow)}
.unlockNew{animation:glowNew 1s 3 alternate}
@keyframes glowNew{to{box-shadow:0 0 0 3px var(--yellow),0 0 22px var(--yellow)}}
.notice{border-left:2px solid var(--yellow);padding-left:12px;font-size:12px;color:var(--muted);margin-top:24px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000e;border:1px solid var(--yellow);border-radius:12px;padding:10px 16px;font-weight:700;z-index:50;max-width:90vw;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.skip{position:absolute;top:-100px;left:12px;background:var(--yellow);color:#111;padding:12px;z-index:10}.skip:focus{top:12px}
@media(max-width:720px){.inventory{grid-template-columns:1fr 1fr}.verdicts{grid-template-columns:1fr}.paper{font-size:15px;padding:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
"use strict";
(() => {
/*
 * Format des preuves :
 *   [[texte]] = L'ÉCART de la preuve (1 au maximum par preuve) · ((texte)) = élément cliquable sans écart.
 *   answer : "E" = Écart · "C" = Fait compatible avec le dossier · "H" = Hors périmètre du dossier.
 *   Règle : answer "E" ⇔ exactement une zone [[...]] ; answer "C" ou "H" ⇔ aucune zone [[...]].
 *   x : explication affichée dans la correction (pourquoi il fallait entourer ou non).
 * Les versions FR et EN doivent garder le même ordre de zones, d'objets et de réponses.
 */
const CASES = {
fr: [
  { doc: "QT-25A349-01", family: "Tige RY", lot: "25A349", kind: "doc",
    facts: [
      { obj: "ticket", title: "Ticket de quarantaine", answer: "E",
        text: "Pièces signalées : ((4 sur 36)). Pièces identifiées : ((07)), ((12)), ((19)), [[quatrième pièce non identifiée]].",
        x: "4 pièces sont signalées mais seulement 3 numéros sont donnés : la quatrième pièce n’est pas tracée. Les numéros 07, 12 et 19 sont corrects." },
      { obj: "photo", title: "Photos du défaut", answer: "E",
        text: "Photos jointes : ((3 photos)). Retouche réalisée le ((02/10)) : [[aucune liste des pièces retouchées]].",
        x: "On ne sait pas quelles pièces ont été retouchées : le lien entre défaut et retouche manque. La date de retouche seule n’est pas un écart." },
      { obj: "record", title: "Bon de commande", answer: "C",
        text: "Référence ((PFX17315)) · Commande ((A75843)) · Lot ((25A349)) : identiques à l’ordre de fabrication.",
        x: "Les trois références correspondent à l’ordre de fabrication : rien à entourer." }
    ],
    risk: "Traçabilité des pièces et de la retouche non démontrée.",
    decision: "Maintenir sous statut contrôlé et demander un complément traçable.",
    why: "Sans lien entre défaut, pièce et retouche, la clôture est prématurée." },
  { doc: "RC-2098 AC", family: "Tige TR", lot: "5390BC", kind: "doc",
    facts: [
      { obj: "binder", title: "Plan de contrôle", answer: "E",
        text: "Plan : ((AQL 2,5)) en production et ((contrôle final à 100 %)). RC final : [[échantillon de 5 pièces sur 40]].",
        x: "Le plan exige un contrôle final à 100 %, le RC n’en montre que 5 sur 40 : c’est l’écart. L’AQL 2,5 concerne la production, il n’est pas en cause." },
      { obj: "gauge", title: "Instrument de mesure", answer: "E",
        text: "Résolution de l’instrument : ((0,01 mm)). Résultat recopié dans le RC : [[8,1234 mm]].",
        x: "Un instrument au 0,01 mm ne peut pas donner 4 décimales : la valeur a été mal recopiée. La résolution de l’instrument est normale." },
      { obj: "screen", title: "Planning de maintenance", answer: "H",
        text: "Rectifieuse ((R-3)) : maintenance préventive prévue le ((14/11)).",
        x: "Cette machine et cette date ne concernent pas le lot 5390BC : information hors périmètre, rien à entourer." }
    ],
    risk: "Contrôle différent de la stratégie prévue.",
    decision: "Ne pas approuver le RC avant alignement.",
    why: "Un rapport rempli ne démontre pas que la bonne stratégie a été appliquée." },
  { doc: "FMER-00968-FR AB", family: "Tige TR 2+", lot: "25C284", kind: "doc",
    facts: [
      { obj: "screen", title: "Écran de la machine", answer: "E",

      { obj: "tray", title: "Kit d’outillage", answer: "E",
        text: "Kit attendu ((00968)) · kit enregistré sur la FMER [[00966]].",
        x: "Le kit enregistré ne correspond pas au kit attendu : la configuration n’est pas maîtrisée." },
      { obj: "record", title: "Fiche de réglage", answer: "C",
        text: "Machine ((INT-7)) · pression ((18 bar)) pour une plage ((16–20 bar)).",
        x: "18 bar est bien dans la plage 16–20 bar : réglage conforme, rien à entourer." }
    ],
    risk: "Démarrage avec une configuration non maîtrisée.",
    decision: "Arrêter la mise en route et clarifier la configuration.",
    why: "Aucune pièce n’est encore usinée : on empêche le démarrage, sans inventer un défaut produit." },
  { doc: "MOP-0014", family: "Tige RB", lot: "5387BC", kind: "doc",
    facts: [
      { obj: "ticket", title: "Ticket de quarantaine", answer: "E",
        text: "QT ouvert le ((29/09)). Première signature de la retouche le [[27/09]], avant l’ouverture du QT.",

      { obj: "record", title: "Feuille de suivi", answer: "E",

        x: "Une deuxième signature sans correction ni justification brouille l’historique. La date du 30/09 seule n’est pas le problème." },
      { obj: "screen", title: "Matrice de compétences", answer: "C",
        text: "Opérateurs ((qualifiés)) sur le poste · contrôle après retouche ((présent)).",
        x: "Qualification et contrôle sont en place : rien à entourer." }
    ],
    risk: "Historique réel des opérations non démontré.",
    decision: "Maintenir en attente et obtenir une correction traçable.",
    why: "Ne pas effacer ni antidater. Établir si une ou deux opérations ont réellement eu lieu." },
  { doc: "NUE-EC094 C", family: "Tige TR", lot: "3176BD", kind: "doc",
    facts: [
      { obj: "binder", title: "Notice au poste", answer: "E",

      { obj: "record", title: "Relevé de mesure", answer: "C",

    facts: [
      { obj: "tray", title: "Pièce 01", answer: "E",

      { obj: "gauge", title: "Moyens de contrôle", answer: "C",

      { obj: "label", title: "Bac rouge", answer: "C",

  { doc: "RC FAI-2114", family: "Tige TR 2+", lot: "6842BD", kind: "tech",
    facts: [
      { obj: "record", title: "Rapport de première pièce", answer: "E",
        text: "Cote L10 : ((3,15 ±0,05 mm)). Mesure A6 : [[3,22 mm]].",
        x: "Limite haute = 3,15 + 0,05 = 3,20 mm : 3,22 mm dépasse. La cote nominale n’est pas en cause." },
      { obj: "screen", title: "Mesure CAN", answer: "C",
        text: "Mesure CAN sur la même pièce : ((3,17 mm)).",
        x: "3,17 mm est dans la tolérance : fait compatible. Mais cette mesure favorable n’annule pas le dépassement A6." },
      { obj: "binder", title: "Archives", answer: "H",
        text: "Rapport FAI de la ((Tige RB)), lot ((5387BC)), archivé en ((2025)).",
        x: "Autre famille, autre lot : hors périmètre, rien à entourer." }
    ],
    risk: "Acceptation injustifiée sur la seule mesure favorable.",
    decision: "Maintenir en investigation et comparer les deux méthodes de mesure.",

  { doc: "FMER-00921-FR", family: "Tige TR taille 2", lot: "25B517", kind: "tech",
    facts: [
      { obj: "tray", title: "Porte-outil", answer: "E",

    ],
    risk: "Altération potentielle par une finition non décrite.",

  { doc: "NUE-EC102", family: "Tige TR", lot: "25C317", kind: "tech",
    facts: [
      { obj: "gauge", title: "Gabarit utilisé", answer: "E",

      { obj: "record", title: "Relevé des butées", answer: "E",
        text: "Butées relevées : [[5,90 mm]] et ((5,96 mm)). Limite basse fictive : ((5,96 mm)).",

        text: "Gabarits ((valides)) · gestuelle ((correcte)).",

    ],
    risk: "Résultats potentiellement inexploitables avec le mauvais gabarit.",

  { doc: "ETQ-LBL-3310", family: "Glénosphère 36", lot: "26B208", kind: "doc",
    facts: [
      { obj: "label", title: "Étiquette produit", answer: "E",
        text: "Lot imprimé sur l’étiquette : [[26B280]]. Lot de l’ordre de fabrication : ((26B208)).",

const START_UNLOCKED = 3;
const totalStars = () => Object.values(P.stars).reduce((a, b) => a + (Number(b) || 0), 0);
const starsNeeded = n => n <= START_UNLOCKED ? 0 : n - 1;

function parseZones(text) {
  const parts = []; const re = /\[\[(.+?)\]\]|\(\((.+?)\)\)/g; let last = 0, m, z = 0;
  while ((m = re.exec(text))) {
    if (m.index > last) parts.push({ t: text.slice(last, m.index) });
    parts.push({ t: m[1] || m[2], zone: z++, bad: !!m[1] });
    last = re.lastIndex;
  }
  if (last < text.length) parts.push({ t: text.slice(last) });
  return parts;
}
const badZone = f => parseZones(f.text).find(p => p.bad);           // l'écart de la preuve (ou undefined)
const zoneText = (f, z) => (parseZones(f.text).find(p => p.zone === z) || {}).t || "";
function maxCase(c) {
  const nE = c.facts.filter(f => badZone(f)).length;
  return 300 + nE * 25 + 25 + 40 + 50 + 30;
}

function startCase(i) {
  const c = CS[i];
  // marks[k] = numéro de la zone entourée pour la preuve k (−1 = rien) : 1 seul écart par preuve
  G = { i, c, verdict: {}, marks: c.facts.map(() => -1), risk: "", decision: "", reason: "", seconds: 0, finished: false, saveMsg: "", saveErr: false, draft: null };
  P.last = i; saveLocal();
  renderScene(t("briefing", { doc: esc(c.doc), fam: esc(c.family), lot: esc(c.lot) }));
  clearInterval(timer);

  content.focus({ preventScroll: true });
}

    if (k < 0) { objs += `<g opacity=".55" aria-hidden="true">${drawObject(obj)}</g>`; continue; }
    const f = G.c.facts[k], seen = !!G.verdict[k];
    const mx = s.x + s.w - 6, my = s.y - 4;
    const marker = seen ? `<g><circle cx="${mx}" cy="${my}" r="15" fill="#16a34a" stroke="#fff" stroke-width="3"/><path d="M${mx - 7} ${my}l5 5 9-10" stroke="#fff" stroke-width="3.5" fill="none"/></g>`
      : P.mode === "accompagne" ? `<g class="marker"><circle cx="${mx}" cy="${my}" r="15" fill="#ffb500" stroke="#111" stroke-width="3"/><text x="${mx}" y="${my + 6}" text-anchor="middle" font-size="18" font-weight="900" fill="#111">?</text></g>` : "";
    objs += `<g class="hs" role="button" tabindex="0" data-action="inspect" data-k="${k}" aria-label="${esc(t("obj" + obj))}${SEP}${esc(f.title)}${seen ? esc(t("examined", { v: lbl(G.verdict[k]) })) : ""}"><rect class="outline" x="${s.x - 10}" y="${s.y - 10}" width="${s.w + 20}" height="${s.h + 20}" rx="12"/>${drawObject(obj)}${marker}</g>`;
  }
  const decor = DECOR.map(d => {
    let g = "";
    if (d.id === "poster") g = `<rect x="${d.x}" y="${d.y}" width="${d.w}" height="${d.h}" fill="#1e3a8a" stroke="#fff" stroke-width="3"/><text x="${d.x + d.w / 2}" y="${d.y + 62}" text-anchor="middle" font-size="44" font-weight="900" fill="#ffb500">5S</text><text x="${d.x + d.w / 2}" y="${d.y + 95}" text-anchor="middle" font-size="12" fill="#fff">${t("poster1")}</text><text x="${d.x + d.w / 2}" y="${d.y + 112}" text-anchor="middle" font-size="12" fill="#fff">${t("poster2")}</text>`;
    if (d.id === "mug") g = `<rect x="${d.x}" y="${d.y + 8}" width="${d.w - 10}" height="${d.h - 8}" rx="5" fill="#f97316"/><path d="M${d.x + d.w - 10} ${d.y + 16}h6a6 6 0 0 1 0 16h-6" stroke="#f97316" stroke-width="4" fill="none"/><path d="M${d.x + 8} ${d.y}q4 -8 0 -14M${d.x + 18} ${d.y}q4 -8 0 -14" stroke="#cbd5e1" stroke-width="2" fill="none"/>`;
    if (d.id === "clock") g = `<circle cx="${d.x + 32}" cy="${d.y + 32}" r="30" fill="#fff" stroke="#111" stroke-width="4"/><path d="M${d.x + 32} ${d.y + 32}v-20M${d.x + 32} ${d.y + 32}l14 8" stroke="#111" stroke-width="4"/>`;
    return `<g class="hs" role="button" tabindex="0" data-action="decor" data-id="${d.id}" aria-label="${t("decorAria")}"><rect class="outline" x="${d.x - 8}" y="${d.y - 16}" width="${d.w + 16}" height="${d.h + 24}" rx="10"/>${g}</g>`;
  }).join("");
  const ready = allRanked();
  const door = `<g class="hs ${ready ? "" : "locked"}" role="button" tabindex="0" data-action="door" aria-label="${t("door")}${ready ? "" : t("doorLocked")}"><rect class="outline" x="878" y="110" width="112" height="340" rx="10"/><rect x="890" y="122" width="88" height="318" fill="#78350f" stroke="#451a03" stroke-width="5"/><rect x="896" y="134" width="76" height="52" fill="#fef3c7"/><text x="934" y="157" text-anchor="middle" font-size="10" font-weight="900" fill="#111">${t("resp1")}</text><text x="934" y="173" text-anchor="middle" font-size="10" font-weight="900" fill="#111">${t("resp2")}</text><circle cx="962" cy="290" r="7" fill="#ffb500"/>${ready ? `<g class="marker"><circle cx="934" cy="230" r="18" fill="#16a34a" stroke="#fff" stroke-width="3"/><text x="934" y="237" text-anchor="middle" font-size="20" font-weight="900" fill="#fff">!</text></g>` : ""}</g>`;
  return `<svg class="scene" viewBox="0 0 1000 600" role="img" aria-label="${t("sceneAria")}">
    <defs><linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cbd5e1"/><stop offset="1" stop-color="#94a3b8"/></linearGradient><linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#334155"/></linearGradient></defs>
    <rect width="1000" height="460" fill="url(#wall)"/><rect y="460" width="1000" height="140" fill="url(#floor)"/><rect y="452" width="1000" height="10" fill="#ffb500"/>
    <rect x="50" y="225" width="190" height="12" fill="#57534e"/><rect x="58" y="237" width="8" height="30" fill="#57534e"/><rect x="224" y="237" width="8" height="30" fill="#57534e"/>
    <rect x="285" y="70" width="275" height="170" rx="6" fill="#a16207"/><rect x="293" y="78" width="259" height="154" fill="#d6a76c"/>
    <rect x="40" y="430" width="740" height="26" fill="#9a3412"/><rect x="40" y="430" width="740" height="8" fill="#c2410c"/><rect x="60" y="456" width="18" height="120" fill="#57534e"/><rect x="740" y="456" width="18" height="120" fill="#57534e"/>
    <rect x="0" y="0" width="1000" height="40" fill="#475569"/>${[120, 360, 600, 840].map(xx => `<rect x="${xx}" y="40" width="90" height="8" fill="#fef9c3"/>`).join("")}
    ${decor}${objs}${door}</svg>`;
}
function renderScene(bubble) {
  if (bubble !== undefined) G.bubble = bubble;
  const ready = allRanked();
  content.innerHTML = `
    <div class="hudbar">
      <span class="tag">${G.c.kind === "doc" ? t("kDoc") : t("kTech")}</span><span class="tag">${esc(G.c.doc)}</span><span class="tag">${esc(G.c.family)} · ${t("lot")} ${esc(G.c.lot)}</span><span class="tag" id="timer">${timeLabel()}</span>
      <span style="flex:1"></span><button class="btn" type="button" data-action="home">${t("dossiers")}</button>
    </div>
    <div class="bubble" role="status">${G.bubble}</div>
    <p class="sceneHint">${t("sceneHint")}</p>
    <div class="sceneWrap">${sceneSVG()}</div>
    <div class="objList" role="group" aria-label="${t("objListTitle")}">${Object.keys(SLOTS).map(obj => { const k = factAt(obj); const seen = k >= 0 && G.verdict[k]; const ev = k >= 0 && P.mode === "accompagne";
      return k >= 0 ? `<button class="btn ${seen ? "done" : ev ? "ev" : ""}" type="button" data-action="inspect" data-k="${k}">${seen ? "✓" : ev ? "?" : "🔍"} ${esc(t("obj" + obj))}</button>`
        : `<button class="btn" type="button" data-action="nothing" data-o="${obj}">🔍 ${esc(t("obj" + obj))}</button>`; }).join("")}</div>
    <div class="inventory" aria-label="${t("invAria")}">
      ${G.c.facts.map((f, k) => G.verdict[k]
        ? `<button class="slot filled" type="button" data-action="inspect" data-k="${k}"><span class="small muted">${t("proof", { n: k + 1 })} · ${esc(f.title)}</span><span class="v">${esc(lbl(G.verdict[k]))}</span><span class="small">${G.marks[k] >= 0 ? esc(t("circled", { z: zoneText(f, G.marks[k]) })) : t("noCircle")}</span></button>`
        : `<div class="slot"><span class="small muted">${t("proof", { n: k + 1 })}</span><span>${P.mode === "accompagne" ? t("toFindA") : t("toFind")}</span></div>`).join("")}
      <button class="slot door ${ready ? "ready" : ""}" type="button" data-action="door">${ready ? t("goDoor") : `${t("office")}<br><span class="small muted">${t("ranked", { n: Object.keys(G.verdict).length })}</span>`}</button>
    </div>`;
}

/* ---------- Loupe ---------- */
let current = -1;
function inspect(k) {
  current = k;
  const f = G.c.facts[k];
  if (!G.draft || G.draft.k !== k) G.draft = { k, verdict: G.verdict[k] || "", mark: G.marks[k] };
  const d = G.draft, parts = parseZones(f.text);
  const needZone = d.verdict === "E" && d.mark < 0;
  openModal(`🔍 ${f.title}`, `
    <div class="paper"><div class="head"><span>${esc(G.c.doc)}</span><span>${esc(G.c.family)} · ${t("lot")} ${esc(G.c.lot)}</span></div>
      <p style="margin:0">${parts.map(p => p.zone === undefined ? esc(p.t) : `<button type="button" class="zone ${d.mark === p.zone ? "marked" : ""}" data-action="zone" data-z="${p.zone}" aria-pressed="${d.mark === p.zone}">${esc(p.t)}</button>`).join("")}</p>
      ${f.obj === "ticket" || f.obj === "label" ? `<span class="stamp">${t("blocked")}</span>` : ""}
    </div>
    <p class="small muted" style="margin-top:12px">${t("loupeHelp")}</p>
    <div class="verdicts" role="radiogroup" aria-label="${t("qualify")}">${VERDICTS.map(code => { const [l, ds] = LABELS[code][L] || LABELS[code].fr; return `<button type="button" class="btn ${d.verdict === code ? "on" : ""}" role="radio" data-action="verdict" data-l="${code}" aria-checked="${d.verdict === code}">${esc(l)}<small>${esc(ds)}</small></button>`; }).join("")}</div>
    ${needZone ? `<p class="hint" role="status">${t("needZone")}</p>` : ""}
    <div class="row" style="margin-top:14px"><button class="btn primary" type="button" data-action="rank" ${d.verdict && !needZone ? "" : "disabled"}>${t("rank")}</button><button class="btn" type="button" data-action="close">${t("close")}</button></div>`);
}
/* Un seul élément entouré par preuve : entourer = « Écart » ; recliquer = désentourer. */
function toggleZone(z) {
  const d = G.draft;
  d.mark = d.mark === z ? -1 : z;
  if (d.mark >= 0) d.verdict = "E";
  inspect(current);
  modal.querySelector(`[data-z="${z}"]`)?.focus();
}
function setVerdict(code) {
  const d = G.draft;
  d.verdict = code;
  if (code !== "E") d.mark = -1;   // compatible ou hors périmètre : rien n'est entouré
  inspect(current);
  modal.querySelector(".verdicts .on")?.focus();
}
function rank() {
  const d = G.draft;
  if (!d || !d.verdict || (d.verdict === "E" && d.mark < 0)) return;
  G.verdict[current] = d.verdict; G.marks[current] = d.mark; G.draft = null;
  closeModal();
  const left = 3 - Object.keys(G.verdict).length;
  renderScene(left ? t("rankedMsg", { v: esc(lbl(G.verdict[current])), n: left }) : t("allRanked"));
}

/* ---------- Décision ---------- */
function door() {
  if (!allRanked()) { toast(t("doorWait")); return; }
  renderDecision();
}
function shuffleOnce(key, arr) {
  G.order = G.order || {};
  if (!G.order[key]) { const o = arr.map((_, i) => i); for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } G.order[key] = o; }
  return G.order[key].map(i => arr[i]);
}
function renderDecision() {
  const c = G.c;
  const n = [G.risk, G.decision, G.reason].filter(Boolean).length;
  const block = (title, name, opts) => `<fieldset class="panel" style="margin-top:12px" role="radiogroup"><legend><b>${title}</b> <span class="small muted">${t("oneEach")}</span></legend>${opts.map(([id, txt]) => `<button type="button" class="btn choice ${G[name] === id ? "on" : ""}" role="radio" data-action="choose" data-name="${name}" data-v="${id}" aria-checked="${G[name] === id}">${esc(txt)}</button>`).join("")}</fieldset>`;
  openModal(t("officeTitle"), `
    <p class="muted">${t("officeQ")}</p>
    <p class="hint">${t("oneChoice")}</p>
    ${block(t("q1"), "risk", shuffleOnce("risk", [["none", t("rNone")], ["expected", c.risk], ["patient", t("rPatient")]]))}
    ${block(t("q2"), "decision", shuffleOnce("decision", [["release", t("dRelease")], ["scrap", t("dScrap")], ["expected", c.decision]]))}
    ${block(t("q3"), "reason", shuffleOnce("reason", [["signed", t("jSigned")], ["expected", t("jExpected")], ["assume", t("jAssume")]]))}
    <p class="small muted" style="margin-top:12px" role="status">${t("answered", { n })}</p>
    <div class="row" style="margin-top:8px"><button class="btn primary" type="button" data-action="validate" ${n === 3 ? "" : "disabled"}>${t("validate")}</button><button class="btn" type="button" data-action="close">${t("back")}</button></div>`);
}

/* ---------- Score et débriefing ---------- */
function result() {
  const c = G.c; let hits = 0, falseFlags = 0, zoneGood = 0, zoneBad = 0, zoneTotal = 0;
  c.facts.forEach((f, k) => {
    const bad = badZone(f), m = G.marks[k];
    if (G.verdict[k] === f.answer) hits++;
    if (G.verdict[k] === "E" && f.answer !== "E") falseFlags++;
    if (bad) zoneTotal++;
    if (m >= 0) { if (bad && bad.zone === m) zoneGood++; else zoneBad++; }
  });
  const score = Math.max(0, hits * 100 + zoneGood * 25 - zoneBad * 15 + (G.risk === "expected" ? 40 : 0) + (G.decision === "expected" ? 50 : 0) + (G.reason === "expected" ? 30 : 0) + (falseFlags === 0 ? 25 : 0) - falseFlags * 40 - (G.decision === "scrap" ? 50 : 0));
  const hub = Math.min(500, Math.round(score / maxCase(c) * 500));
  const all = G.risk === "expected" && G.decision === "expected" && G.reason === "expected";
  const stars = hits === 3 && all && zoneGood === zoneTotal && zoneBad === 0 ? 3 : hits >= 2 && G.decision === "expected" ? 2 : 1;
  return { hits, falseFlags, zoneGood, zoneBad, zoneTotal, score, hub, stars };
}
function validate() {
  if (!(G.risk && G.decision && G.reason) || G.finished) return;
  G.finished = true; clearInterval(timer);
  const r = result(); G.result = r;
  P.done++;
  const improved = r.hub > (Number(P.hub[G.i]) || 0);
  if (improved) P.hub[G.i] = r.hub;
  if (r.score > (Number(P.best[G.i]) || 0)) P.best[G.i] = r.score;
  const before = unlockedCount();
  P.stars[G.i] = Math.max(Number(P.stars[G.i]) || 0, r.stars);
  G.unlocked = unlockedCount() > before ? unlockedCount() - 1 : -1;
  newUnlock = G.unlocked;
  saveLocal();
  closeModal(true);
  renderDebrief();
  if (improved) saveRemote(); else { G.saveMsg = t("notBetter"); updateSave(); }
}
function zonesHTML(f, k) {
  const m = G.marks[k];
  return parseZones(f.text).map(p => {
    if (p.zone === undefined) return esc(p.t);
    const marked = m === p.zone;
    const cls = p.bad ? (marked ? "good" : "missed") : (marked ? "bad" : "");
    return cls ? `<span class="zone ${cls}">${esc(p.t)}</span>` : esc(p.t);
  }).join("");
}
function renderDebrief() {
  const c = G.c, r = G.result;
  content.innerHTML = `
    <div class="hudbar"><span class="tag">${esc(c.doc)}</span><span class="tag">${timeLabel()}</span><span style="flex:1"></span><button class="btn" type="button" data-action="home">${t("dossiers")}</button></div>
    <section class="panel">
      <p class="stars" aria-label="${t("starsLbl", { n: r.stars })}">${"★".repeat(r.stars)}${"☆".repeat(3 - r.stars)}</p>
      <p class="score">${t("ptsHub", { s: r.score, h: r.hub })}</p>
      <p style="text-align:center">${t("resLine", { h: r.hits, g: r.zoneGood, t: r.zoneTotal, b: r.zoneBad })}</p>
      <p class="save" id="saveStatus" role="status"></p>
      ${G.unlocked >= 0 ? `<p class="unlockInfo" style="text-align:center">${t("unlockedNew", { doc: esc(CS[G.unlocked].doc) })}</p>` : ""}
    </section>
    <h2 style="margin-top:18px">${t("correction")}</h2>
    <p class="small muted">${t("legendZ")}</p>
    ${c.facts.map((f, k) => `<article class="panel" style="margin-top:10px"><p class="small muted">${t("proof", { n: k + 1 })} · ${esc(f.title)}</p><div class="paper" style="font-size:15px">${zonesHTML(f, k)}</div>
      <p style="margin-top:10px">${t("yourChoice")}${SEP}<b class="${G.verdict[k] === f.answer ? "ok" : "ko"}">${esc(lbl(G.verdict[k]))}</b> · ${t("expected")}${SEP}<b>${esc(lbl(f.answer))}</b></p>
      <p class="why"><b>${t("whyLbl")}</b> ${esc(f.x)}</p></article>`).join("")}
    <section class="panel" style="margin-top:14px;border-color:#ffb50080">
      <h3>${t("reasoning")}</h3><p>${esc(c.why)}</p>
      <p><b>${t("expRisk")}</b> ${esc(c.risk)} <span class="${G.risk === "expected" ? "ok" : "ko"}">${G.risk === "expected" ? "✓" : "✗"}</span></p>
      <p><b>${t("expDec")}</b> ${esc(c.decision)} <span class="${G.decision === "expected" ? "ok" : "ko"}">${G.decision === "expected" ? "✓" : "✗"}</span></p>
      <p><b>${t("justif")}</b> ${G.reason === "expected" ? `<span class="ok">${t("right")}</span>` : `<span class="ko">${t("wrong")}</span>`}</p>
      <p class="muted small">${t("before")}</p>
    </section>
    <details class="panel" style="margin-top:12px"><summary>${t("howScore")}</summary><p style="margin-top:10px" class="small">${t("scoreRules")}</p></details>
    <div class="row" style="margin-top:14px"><button class="btn primary" type="button" data-action="random">${t("nextCase")}</button><button class="btn" type="button" data-action="case" data-i="${G.i}">${t("replayCase")}</button></div>`;
  updateSave(); content.focus({ preventScroll: true }); scrollTo({ top: 0 });
}
function updateSave() { const el = document.getElementById("saveStatus"); if (el) { el.textContent = G.saveMsg; el.classList.toggle("err", G.saveErr); } }
async function saveRemote() {
  if (!scores) { G.saveMsg = t("saveNA"); G.saveErr = true; updateSave(); return; }
  saving = true; G.saveMsg = t("saving"); G.saveErr = false; updateSave();
  try { const saved = await scores.saveBestScore(hubTotal()); remoteBest = saved; G.saveMsg = t("saved", { n: fmt(saved) }); }
  catch (e) { console.error(e); G.saveMsg = t("saveErr"); G.saveErr = true; }
  finally { saving = false; updateSave(); }
}

/* ---------- Utilitaires ---------- */
let prevFocus = null;
function openModal(title, body) {
  if (!modal.open) prevFocus = document.activeElement;
  modal.innerHTML = `<h2 id="modalTitle">${esc(title)}</h2>${body}`;
  if (!modal.open) modal.showModal();
}
function closeModal(noRestore) {
  if (modal.open) modal.close();
  if (!noRestore && prevFocus && prevFocus.isConnected) prevFocus.focus();
  prevFocus = null;
}
let toastT = 0;
function toast(s) { toastEl.textContent = s; toastEl.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("on"), 3200); }
function help() {
  openModal(t("helpTitle"), `<ol><li>${t("h1")}</li><li>${t("h2")}</li><li>${t("h3")}</li><li>${t("h4")}</li></ol>
  <p class="small">${t("glossary")}</p><p class="small muted">${t("defs")}</p>
  <button class="btn primary" type="button" data-action="close">${t("gotIt")}</button>`);
}
function pickRandom() {
  let pool = CS.map((_, i) => i).filter(i => isUnlocked(i) && i !== P.last);
  if (!pool.length) pool = CS.map((_, i) => i).filter(isUnlocked);
  const unsolved = pool.filter(i => !P.hub[i]);
  const from = unsolved.length ? unsolved : pool;
  return from[Math.floor(Math.random() * from.length)];
}

/* ---------- Événements ---------- */
function act(el) {
  const a = el.dataset.action;
  if (a === "help") return help();
  if (a === "close") { if (G) G.draft = null; return closeModal(); }
  if (a === "random") { closeModal(true); return startCase(pickRandom()); }
  if (a === "case") { if (!isUnlocked(+el.dataset.i)) { toast(t("lockedToast", { need: starsNeeded(+el.dataset.i + 1), s: totalStars() })); return; } closeModal(true); return startCase(+el.dataset.i); }
  if (a === "home") { if (G && !G.finished && Object.keys(G.verdict).length && !confirm(t("abandon"))) return; return renderHome(); }
  if (!G) return;
  if (a === "inspect") { G.draft = null; return inspect(+el.dataset.k); }
  if (a === "zone") return toggleZone(+el.dataset.z);
  if (a === "verdict") { if (G.draft) setVerdict(el.dataset.l); return; }
  if (a === "rank") return rank();
  if (a === "decor") return renderScene(esc(t(el.dataset.id)));
  if (a === "nothing") return renderScene(esc(t("nothing", { o: t("obj" + el.dataset.o) })));
  if (a === "door") return door();
  if (a === "choose") { G[el.dataset.name] = el.dataset.v; renderDecision(); modal.querySelector(`[data-name="${el.dataset.name}"].on`)?.focus(); return; }
  if (a === "validate") return validate();
}
document.addEventListener("click", e => { const el = e.target.closest("[data-action]"); if (!el || el.disabled) return; act(el); });
document.addEventListener("keydown", e => {
  const el = e.target.closest && e.target.closest("g.hs[data-action]");
  if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); act(el); }
});
modal.addEventListener("cancel", () => { if (G) G.draft = null; });   // touche Échap : brouillon abandonné
content.addEventListener("change", e => { if (e.target.id === "mode") { P.mode = e.target.value === "expert" ? "expert" : "accompagne"; saveLocal(); } });
window.addEventListener("beforeunload", e => { if ((G && !G.finished && Object.keys(G.verdict).length) || saving || window.QWScores?.isSyncing()) { e.preventDefault(); e.returnValue = ""; } });

content.innerHTML = `<p class="panel">…</p>`;
window.addEventListener("DOMContentLoaded", async () => {
  if (!window.QWScores) { content.innerHTML = `<p class="panel">${t("noService")}</p>`; return; }
  const r = await window.QWScores.boot("scenarios", { progress: true });
  if (!r) return;
  scores = r.scores; remoteBest = r.best;
  loadProgress(r.progress);
  if (r.progress && remoteBest < hubTotal()) { try { remoteBest = await scores.saveBestScore(hubTotal()); } catch (e) { console.warn(e); } }
  if (!G) renderHome();
}, { once: true });
})();
</script>
</body>
