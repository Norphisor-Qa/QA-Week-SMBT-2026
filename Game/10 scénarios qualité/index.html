<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090b">
<title>Scénarios qualité | Quality Week 2026</title>
<style>
:root{color-scheme:dark;--bg:#09090b;--panel:#18181b;--border:#3f3f46;--text:#f4f4f5;--muted:#a1a1aa;--yellow:#ffb500;--green:#4ade80;--red:#fb7185}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.55 Arial,Helvetica,sans-serif}
main{max-width:1100px;margin:auto;padding:16px 14px 40px}
h1{font-size:clamp(34px,7vw,60px);line-height:1;letter-spacing:-.05em;margin:18px 0 8px}
h2{font-size:22px;line-height:1.25;margin:0 0 12px}h3{margin:0 0 10px}p{margin:0 0 12px}
button,select{font:inherit}
.btn{min-height:46px;border:1px solid #52525b;border-radius:12px;background:#18181b;color:var(--text);padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700}
.btn:hover:not(:disabled){background:#27272a}.btn:disabled{opacity:.4;cursor:default}
.primary{background:var(--yellow);border-color:var(--yellow);color:#111;font-weight:850}.primary:hover:not(:disabled){background:#fef08a}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}
.brand{color:var(--yellow);font-size:11px;letter-spacing:.15em;font-weight:800}
.muted{color:var(--muted)}.small{font-size:13px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px}
.tag{background:#27272a;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:700}
select{background:#27272a;color:var(--text);border:1px solid #52525b;border-radius:10px;padding:10px;min-height:46px}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
.caseCard{text-align:left;align-items:flex-start;flex-direction:column;min-height:120px;padding:14px;border-radius:14px}
.caseCard b{font-size:15px}.caseCard .st{color:var(--yellow);letter-spacing:3px;font-size:18px}
.hudbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.sceneWrap{position:relative;border-radius:18px;overflow:hidden;border:2px solid #3f3f46;background:#1b1d22}
svg.scene{display:block;width:100%;height:auto}
.objList{display:none}
@media(max-width:720px){
  main{padding:8px 8px 30px}
  h1{font-size:36px;margin:8px 0 4px}
  .hudbar .tag:nth-child(3){display:none}
  .sceneHint{display:block!important}
  .bubble{font-size:13.5px;padding:8px 10px}
  .objList{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
  .objList .btn{min-height:46px;justify-content:flex-start;text-align:left;font-size:14px;padding:8px 10px}
  .objList .btn.ev{border-color:var(--yellow)}
  .objList .btn.done{border-color:var(--green);color:var(--green)}
  .inventory{gap:6px}.slot{min-height:64px;padding:8px}
  .cases{grid-template-columns:1fr 1fr;gap:8px}.caseCard{min-height:100px;padding:10px}
}
.sceneHint{display:none;font-size:12px;color:var(--muted);margin:4px 0}
.hs{cursor:pointer}
.hs .outline{fill:transparent;stroke:transparent;stroke-width:4}
.hs:hover .outline,.hs:focus-visible .outline{stroke:var(--yellow);fill:#ffb50022}
.hs:focus{outline:none}
.hs .marker{animation:bob 1.3s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px)}}
.hs.locked{cursor:not-allowed}
.bubble{margin:0 0 10px;background:#000;border:1px solid var(--yellow);border-radius:14px;padding:10px 14px;font-size:14.5px}
.bubble b{color:var(--yellow)}
.inventory{display:grid;grid-template-columns:repeat(3,1fr) 1.2fr;gap:10px;margin-top:12px}
.slot{min-height:84px;border:2px dashed #52525b;border-radius:14px;padding:10px;font-size:13px;display:flex;flex-direction:column;justify-content:center;background:#121214;text-align:left;color:var(--text)}
.slot.filled{border-style:solid;border-color:var(--yellow);background:#1f1d10;cursor:pointer}
.slot .v{font-weight:850;color:var(--yellow)}
.slot.door{border-style:solid;border-color:#52525b;font-weight:800;align-items:center;text-align:center;cursor:pointer}
.slot.door.ready{border-color:var(--green);background:#0f2a1a;animation:glow 1.2s infinite alternate}
@keyframes glow{to{box-shadow:0 0 18px #4ade8066}}
dialog{width:calc(100% - 24px);max-width:720px;max-height:92dvh;overflow:auto;background:#18181b;color:var(--text);border:2px solid var(--yellow);border-radius:18px;padding:20px}
dialog::backdrop{background:#000c;backdrop-filter:blur(3px)}
.paper{position:relative;background:#f5f1e6;color:#18181b;border-radius:6px;padding:22px 22px 18px;box-shadow:0 10px 30px #000a;font-family:"Courier New",monospace;font-size:16.5px;line-height:1.9;background-image:repeating-linear-gradient(#f5f1e6 0 30px,#e6dfcc 30px 31px)}
.paper .head{display:flex;justify-content:space-between;gap:10px;font:800 12px/1.3 system-ui,sans-serif;letter-spacing:.06em;border-bottom:2px solid #18181b;padding-bottom:6px;margin-bottom:10px;text-transform:uppercase}
.paper .stamp{position:absolute;right:16px;bottom:10px;transform:rotate(-8deg);border:3px solid #b91c1c;color:#b91c1c;font:900 13px system-ui;padding:2px 8px;border-radius:6px;opacity:.75}
.zone{font:inherit;font-weight:800;color:#0b3d91;background:#dbeafe;border:2px dashed #3b82f6;border-radius:6px;padding:0 4px;cursor:zoom-in;line-height:1.5}
.zone:hover{background:#bfdbfe}
.zone.marked{background:#fee2e2;color:#7f1d1d;border:3px solid #dc2626;border-radius:40%;box-shadow:0 0 0 2px #fca5a5}
.zone.good{background:#dcfce7;color:#14532d;border:3px solid #16a34a}
.zone.bad{background:#fee2e2;color:#7f1d1d;border:3px solid #dc2626;text-decoration:line-through}
.zone.missed{background:#fef9c3;border:3px dashed #ca8a04;color:#713f12}
.verdicts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.verdicts .btn{flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;gap:0}
.verdicts .btn.on{background:var(--yellow);color:#111;border-color:var(--yellow)}
.verdicts small{display:block;font-weight:500;font-size:12px;opacity:.85}
.choice{display:block;width:100%;text-align:left;margin-top:8px;justify-content:flex-start}
.choice.on{background:var(--yellow);color:#111;border-color:var(--yellow)}
.stars{color:var(--yellow);font-size:44px;letter-spacing:6px;text-align:center}
.score{font-size:34px;font-weight:900;text-align:center;margin:0}
.ok{color:var(--green)}.ko{color:var(--red)}
.save{font-weight:800;color:var(--yellow);text-align:center}.save.err{color:var(--red)}
.qwLogo{height:42px;width:auto;border-radius:4px}
@media(max-width:520px){.qwLogo{height:32px}}
.caseCard.locked{opacity:.55;cursor:not-allowed;border-style:dashed}
.caseCard .lockIco{font-size:22px}
.unlockInfo{margin-top:10px;font-weight:700;color:var(--yellow)}
.unlockNew{animation:glowNew 1s 3 alternate}
@keyframes glowNew{to{box-shadow:0 0 0 3px var(--yellow),0 0 22px var(--yellow)}}
.notice{border-left:2px solid var(--yellow);padding-left:12px;font-size:12px;color:var(--muted);margin-top:24px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000e;border:1px solid var(--yellow);border-radius:12px;padding:10px 16px;font-weight:700;z-index:50;max-width:90vw;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.skip{position:absolute;top:-100px;left:12px;background:var(--yellow);color:#111;padding:12px;z-index:10}.skip:focus{top:12px}
@media(max-width:720px){.inventory{grid-template-columns:1fr 1fr}.verdicts{grid-template-columns:1fr}.paper{font-size:15px;padding:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    last = re.lastIndex;
  }
  if (last < text.length) parts.push({ t: text.slice(last) });
  return parts;
}

  G.verdict[current] = G.draft.verdict; G.draft = null;
  closeModal();
  const left = 3 - Object.keys(G.verdict).length;
  renderScene(left ? t("rankedMsg", { v: esc(lbl(G.verdict[current])), n: left }) : t("allRanked"));
}

/* ---------- Décision ---------- */
function door() {
  if (!allRanked()) { toast(t("doorWait")); return; }
  renderDecision();
}
function shuffleOnce(key, arr) {
  G.order = G.order || {};
  if (!G.order[key]) { const o = arr.map((_, i) => i); for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } G.order[key] = o; }
  return G.order[key].map(i => arr[i]);
}
function renderDecision() {
  const c = G.c;
  const block = (title, name, opts) => `<fieldset class="panel" style="margin-top:12px"><legend><b>${title}</b></legend>${opts.map(([id, txt]) => `<button type="button" class="btn choice ${G[name] === id ? "on" : ""}" data-action="choose" data-name="${name}" data-v="${id}" aria-pressed="${G[name] === id}">${esc(txt)}</button>`).join("")}</fieldset>`;
  openModal(t("officeTitle"), `
    <p class="muted">${t("officeQ")}</p>
    ${block(t("q1"), "risk", shuffleOnce("risk", [["none", t("rNone")], ["expected", c.risk], ["patient", t("rPatient")]]))}
    ${block(t("q2"), "decision", shuffleOnce("decision", [["release", t("dRelease")], ["scrap", t("dScrap")], ["expected", c.decision]]))}
    ${block(t("q3"), "reason", shuffleOnce("reason", [["signed", t("jSigned")], ["expected", t("jExpected")], ["assume", t("jAssume")]]))}
    <div class="row" style="margin-top:14px"><button class="btn primary" type="button" data-action="validate" ${G.risk && G.decision && G.reason ? "" : "disabled"}>${t("validate")}</button><button class="btn" type="button" data-action="close">${t("back")}</button></div>`);
}

/* ---------- Score et débriefing ---------- */
function result() {
  const c = G.c; let hits = 0, falseFlags = 0, zoneGood = 0, zoneBad = 0, zoneTotal = 0;
  c.facts.forEach((f, k) => {
    if (G.verdict[k] === f.answer) hits++;
    if (G.verdict[k] === "A" && f.answer !== "A") falseFlags++;
    parseZones(f.text).forEach(p => { if (p.zone === undefined) return; if (p.bad) zoneTotal++; if (G.marks[k].has(p.zone)) p.bad ? zoneGood++ : zoneBad++; });
  });
  const score = Math.max(0, hits * 100 + zoneGood * 25 - zoneBad * 15 + (G.risk === "expected" ? 40 : 0) + (G.decision === "expected" ? 50 : 0) + (G.reason === "expected" ? 30 : 0) + (falseFlags === 0 ? 25 : 0) - falseFlags * 40 - (G.decision === "scrap" ? 50 : 0));
  const hub = Math.min(500, Math.round(score / maxCase(c) * 500));
  const all = G.risk === "expected" && G.decision === "expected" && G.reason === "expected";
  const stars = hits === 3 && all && zoneGood === zoneTotal && zoneBad === 0 ? 3 : hits >= 2 && G.decision === "expected" ? 2 : 1;
  return { hits, falseFlags, zoneGood, zoneBad, zoneTotal, score, hub, stars };
}
function validate() {
  if (!(G.risk && G.decision && G.reason) || G.finished) return;
  G.finished = true; clearInterval(timer);
  const r = result(); G.result = r;
  P.done++;
  const improved = r.hub > (Number(P.hub[G.i]) || 0);
  if (improved) P.hub[G.i] = r.hub;
  if (r.score > (Number(P.best[G.i]) || 0)) P.best[G.i] = r.score;
  const before = unlockedCount();
  P.stars[G.i] = Math.max(Number(P.stars[G.i]) || 0, r.stars);
  G.unlocked = unlockedCount() > before ? unlockedCount() - 1 : -1;   // index du dernier dossier débloqué
  newUnlock = G.unlocked;
  saveLocal();
  closeModal(true);
  renderDebrief();
  if (improved) saveRemote(); else { G.saveMsg = t("notBetter"); updateSave(); }
}
function zonesHTML(f, k) {
  return parseZones(f.text).map(p => {
    if (p.zone === undefined) return esc(p.t);
    const m = G.marks[k].has(p.zone);
    const cls = p.bad ? (m ? "good" : "missed") : (m ? "bad" : "");
    return cls ? `<span class="zone ${cls}">${esc(p.t)}</span>` : esc(p.t);
  }).join("");
}
function renderDebrief() {
  const c = G.c, r = G.result;
  content.innerHTML = `
    <div class="hudbar"><span class="tag">${esc(c.doc)}</span><span class="tag">${timeLabel()}</span><span style="flex:1"></span><button class="btn" type="button" data-action="home">${t("dossiers")}</button></div>
    <section class="panel">
      <p class="stars" aria-label="${t("starsLbl", { n: r.stars })}">${"★".repeat(r.stars)}${"☆".repeat(3 - r.stars)}</p>
      <p class="score">${t("ptsHub", { s: r.score, h: r.hub })}</p>
      <p style="text-align:center">${t("resLine", { h: r.hits, g: r.zoneGood, t: r.zoneTotal, b: r.zoneBad, f: r.falseFlags })}</p>
      <p class="save" id="saveStatus" role="status"></p>
      ${G.unlocked >= 0 ? `<p class="unlockInfo" style="text-align:center">${t("unlockedNew", { doc: esc(CS[G.unlocked].doc) })}</p>` : ""}
    </section>
    <h2 style="margin-top:18px">${t("correction")}</h2>
    <p class="small muted">${t("legendZ")}</p>
    ${c.facts.map((f, k) => `<article class="panel" style="margin-top:10px"><p class="small muted">${t("proof", { n: k + 1 })} · ${esc(f.title)}</p><div class="paper" style="font-size:15px">${zonesHTML(f, k)}</div>
      <p style="margin-top:10px">${t("yourChoice")}${SEP}<b class="${G.verdict[k] === f.answer ? "ok" : "ko"}">${esc(lbl(G.verdict[k]))}</b> · ${t("expected")}${SEP}<b>${esc(lbl(f.answer))}</b></p></article>`).join("")}
    <section class="panel" style="margin-top:14px;border-color:#ffb50080">
      <h3>${t("reasoning")}</h3><p>${esc(c.why)}</p>
      <p><b>${t("expRisk")}</b> ${esc(c.risk)} <span class="${G.risk === "expected" ? "ok" : "ko"}">${G.risk === "expected" ? "✓" : "✗"}</span></p>
      <p><b>${t("expDec")}</b> ${esc(c.decision)} <span class="${G.decision === "expected" ? "ok" : "ko"}">${G.decision === "expected" ? "✓" : "✗"}</span></p>
      <p><b>${t("justif")}</b> ${G.reason === "expected" ? `<span class="ok">${t("right")}</span>` : `<span class="ko">${t("wrong")}</span>`}</p>
      <p class="muted small">${t("before")}</p>
    </section>
    <details class="panel" style="margin-top:12px"><summary>${t("howScore")}</summary><p style="margin-top:10px" class="small">${t("scoreRules")}</p></details>
    <div class="row" style="margin-top:14px"><button class="btn primary" type="button" data-action="random">${t("nextCase")}</button><button class="btn" type="button" data-action="case" data-i="${G.i}">${t("replayCase")}</button></div>`;
  updateSave(); content.focus({ preventScroll: true }); scrollTo({ top: 0 });
}
function updateSave() { const el = document.getElementById("saveStatus"); if (el) { el.textContent = G.saveMsg; el.classList.toggle("err", G.saveErr); } }
async function saveRemote() {
  if (!scores) { G.saveMsg = t("saveNA"); G.saveErr = true; updateSave(); return; }
  saving = true; G.saveMsg = t("saving"); G.saveErr = false; updateSave();
  try { const saved = await scores.saveBestScore(hubTotal()); remoteBest = saved; G.saveMsg = t("saved", { n: fmt(saved) }); }
  catch (e) { console.error(e); G.saveMsg = t("saveErr"); G.saveErr = true; }
  finally { saving = false; updateSave(); }
}

/* ---------- Utilitaires ---------- */
let prevFocus = null;
function openModal(title, body) {
  if (!modal.open) prevFocus = document.activeElement;
  modal.innerHTML = `<h2 id="modalTitle">${esc(title)}</h2>${body}`;
  if (!modal.open) modal.showModal();
}
function closeModal(noRestore) {
  if (modal.open) modal.close();
  if (!noRestore && prevFocus && prevFocus.isConnected) prevFocus.focus();
  prevFocus = null;
}
let toastT = 0;
function toast(s) { toastEl.textContent = s; toastEl.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("on"), 3200); }
function help() {
  openModal(t("helpTitle"), `<ol><li>${t("h1")}</li><li>${t("h2")}</li><li>${t("h3")}</li><li>${t("h4")}</li></ol>
  <p class="small">${t("glossary")}</p><p class="small muted">${t("defs")}</p>
  <button class="btn primary" type="button" data-action="close">${t("gotIt")}</button>`);
}
function pickRandom() {
  let pool = CS.map((_, i) => i).filter(i => isUnlocked(i) && i !== P.last);
  if (!pool.length) pool = CS.map((_, i) => i).filter(isUnlocked);
  const unsolved = pool.filter(i => !P.hub[i]);
  const from = unsolved.length ? unsolved : pool;
  return from[Math.floor(Math.random() * from.length)];
}

/* ---------- Événements ---------- */
function act(el) {
  const a = el.dataset.action;
  if (a === "help") return help();
  if (a === "close") return closeModal();
  if (a === "random") { closeModal(true); return startCase(pickRandom()); }
  if (a === "case") { if (!isUnlocked(+el.dataset.i)) { toast(t("lockedToast", { need: starsNeeded(+el.dataset.i + 1), s: totalStars() })); return; } closeModal(true); return startCase(+el.dataset.i); }
  if (a === "home") { if (G && !G.finished && Object.keys(G.verdict).length && !confirm(t("abandon"))) return; return renderHome(); }
  if (!G) return;
  if (a === "inspect") { G.draft = null; return inspect(+el.dataset.k); }
  if (a === "zone") return toggleZone(+el.dataset.z);
  if (a === "verdict") { if (!G.draft) return; G.draft.verdict = el.dataset.l; inspect(current); modal.querySelector(".verdicts .on")?.focus(); return; }
  if (a === "rank") return rank();
  if (a === "decor") return renderScene(esc(t(el.dataset.id)));
  if (a === "nothing") return renderScene(esc(t("nothing", { o: t("obj" + el.dataset.o) })));
  if (a === "door") return door();
  if (a === "choose") { G[el.dataset.name] = el.dataset.v; renderDecision(); modal.querySelector(`[data-name="${el.dataset.name}"].on`)?.focus(); return; }
  if (a === "validate") return validate();
}
document.addEventListener("click", e => { const el = e.target.closest("[data-action]"); if (!el || el.disabled) return; act(el); });
document.addEventListener("keydown", e => {
  const el = e.target.closest && e.target.closest("g.hs[data-action]");
  if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); act(el); }
});
content.addEventListener("change", e => { if (e.target.id === "mode") { P.mode = e.target.value === "expert" ? "expert" : "accompagne"; saveLocal(); } });
window.addEventListener("beforeunload", e => { if ((G && !G.finished && Object.keys(G.verdict).length) || saving) { e.preventDefault(); e.returnValue = ""; } });

renderHome();
window.addEventListener("DOMContentLoaded", async () => {
  if (!window.QWScores) { content.insertAdjacentHTML("afterbegin", `<p class="panel">${t("noService")}</p>`); return; }
  const r = await window.QWScores.boot("scenarios");
  if (!r) return;
  scores = r.scores; remoteBest = r.best;
  if (remoteBest < hubTotal()) { try { remoteBest = await scores.saveBestScore(hubTotal()); } catch (e) { console.warn(e); } }
  if (!G) renderHome();
}, { once: true });
})();
</script>
