<style>
:root{--gold:#ffb500;--ink:#0b0b0c;--soft:#f5f5f2;--green:#1d6b3b;--red:#a40000;--blue:#1c5687}
*{box-sizing:border-box}
body{margin:0;background:var(--soft);color:var(--ink);font:17px/1.55 Arial,Helvetica,sans-serif}
main{max-width:920px;margin:auto;padding:16px 14px 40px}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.16em;color:#333}
h1{font-size:clamp(34px,7vw,56px);line-height:1;letter-spacing:-.04em;margin:14px 0 6px}
h2{font-size:24px;margin:0 0 10px}h3{margin:0 0 8px}p{margin:0 0 12px}
button,input{font:inherit}
.btn{min-height:48px;padding:10px 18px;border:2px solid #000;border-radius:12px;background:#fff;color:#000;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--gold)}.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
:focus-visible{outline:3px solid #000;outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}
.card{background:#fff;border:2px solid #111;border-top:8px solid var(--gold);border-radius:18px;padding:18px;box-shadow:0 8px 0 #0001}
.muted{color:#444}.small{font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.level{display:flex;flex-direction:column;gap:6px;min-height:220px}
.level .num{width:46px;height:46px;border-radius:50%;background:var(--gold);border:2px solid #000;display:grid;place-items:center;font-weight:900;font-size:20px}
.level.done{background:#eefaf2;border-color:var(--green);border-top-color:var(--green)}.level.done .num{background:var(--green);color:#fff}
.level.locked{opacity:.6}
.level .st{font-weight:900}.level .btn{margin-top:auto}
.total{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.total div{background:#fff;border:2px solid #111;border-left:8px solid var(--gold);border-radius:12px;padding:8px 14px}
.total b{display:block;font-size:24px}
.warn{background:#fff6dd;border:2px dashed var(--gold);border-radius:12px;padding:10px 14px;font-size:15px}
.status{min-height:24px;font-weight:800}.status.err{color:var(--red)}.status.ok{color:var(--green)}
.riddle{font-size:clamp(19px,2.6vw,24px);font-weight:700;line-height:1.45;border-left:8px solid var(--gold);padding-left:16px;margin:16px 0}
.pattern{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0 16px}
.pattern span{width:30px;height:36px;border-bottom:4px solid #111}
.pattern span.gap{border:0;width:14px}
.answer{width:100%;min-height:54px;padding:10px 14px;border:3px solid #111;border-radius:12px;font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.lives{font-size:24px;letter-spacing:4px}
.hang{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:center}
.hang svg{width:100%;max-width:240px;height:auto;background:#fff;border:2px solid #111;border-radius:16px}
.word{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.word span{width:clamp(22px,5vw,36px);height:clamp(30px,6vw,44px);border-bottom:4px solid #111;display:grid;place-items:center;font-size:clamp(18px,3.5vw,28px);font-weight:900}
.word span.miss{color:var(--red)}
.keys{display:grid;grid-template-columns:repeat(13,1fr);gap:5px}
.key{min-height:46px;border:2px solid #111;border-radius:8px;background:#fff;font-weight:900;cursor:pointer;padding:0;font-size:17px}
.key.hit{background:var(--green);color:#fff;border-color:var(--green)}
.key.miss{background:#eee;color:#666;border-color:#bbb;text-decoration:line-through}
.cw{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.grid{display:grid;gap:2px;grid-auto-rows:var(--cs);align-content:start;justify-content:start;user-select:none}
.cell{position:relative;width:var(--cs);height:var(--cs)}
.cell.on{background:#fff;border:2px solid #111;border-radius:4px}
.cell input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-weight:900;font-size:calc(var(--cs)*.55);text-transform:uppercase;padding:0;caret-color:transparent;border-radius:2px}
.cell.inword input{background:#fff3c4}.cell.cur input{background:var(--gold)}
.cell .n{position:absolute;left:2px;top:0;font-size:calc(var(--cs)*.28);font-weight:900;pointer-events:none;line-height:1.1}
.cell.good input{background:#d7f5e1;color:var(--green)}.cell.bad input{background:#fde2e1;color:var(--red)}.cell.rev input{color:var(--blue)}
.clues{display:grid;gap:12px;font-size:15px}
.clues ol{margin:0;padding-left:0;list-style:none}
.clues li{padding:5px 8px;border-radius:8px;cursor:pointer}
.clues li.cur{background:#fff3c4;font-weight:700}
.clues li.ok{color:var(--green)}
.result{text-align:center}
.result .pts{font-size:56px;font-weight:950;line-height:1}
.explain{background:#fff6dd;border-left:6px solid var(--gold);padding:12px 14px;border-radius:10px;text-align:left}
.dateline::first-letter{text-transform:uppercase}
.curClue{position:sticky;top:0;z-index:5;margin:8px 0;padding:10px 12px;background:#fff3c4;border:2px solid #111;border-radius:10px;font-size:15px}
.grid{overflow:hidden}
footer{margin-top:24px;font-size:13px;color:#444;text-align:center}
@media(max-width:760px){main{padding:8px 8px 30px}.card{padding:12px}.cw .clues{font-size:14px}.levels{grid-template-columns:1fr}.level{min-height:0}.hang{grid-template-columns:1fr}.hang svg{max-width:180px;margin:auto}.keys{grid-template-columns:repeat(9,1fr)}.cw{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

(() => {
/* Contenus du Défi du jour : 15 éléments par niveau, MÊME ORDRE en français et en anglais

const RIDDLES = {
fr: [
  { q: "Je suis le fil qui relie chaque pièce à son histoire : sans moi, impossible de savoir d’où elle vient ni où elle est partie.", a: ["TRAÇABILITÉ"], hint: "On me garantit grâce au numéro de lot.", e: "La traçabilité permet de retrouver l’historique, l’utilisation et la localisation d’un produit, notamment en cas de rappel." },
  { q: "J’ai un ticket, une zone et une étiquette rouge, mais je ne voyage jamais tant qu’on n’a pas décidé de mon sort.", a: ["QUARANTAINE"], hint: "Mon nom évoque une durée de quarante jours.", e: "La quarantaine isole les produits en attente de décision : personne ne doit les utiliser ni retirer l’étiquette." },
  { q: "On me pose cinq fois de suite pour remonter du symptôme jusqu’à la cause racine.", a: ["POURQUOI", "5 POURQUOI", "CINQ POURQUOI"], hint: "C’est une question, pas une réponse.", e: "La méthode des 5 Pourquoi aide à dépasser le symptôme pour trouver la cause racine d’un problème." },
  { q: "Je ressemble à une arête de poisson et je range les causes possibles en familles : matière, méthode, machine, main-d’œuvre, milieu…", a: ["ISHIKAWA", "DIAGRAMME D'ISHIKAWA"], hint: "Je porte le nom d’un ingénieur japonais.", e: "Le diagramme d’Ishikawa (5M) classe les causes possibles d’un effet pour structurer l’analyse." },
  { q: "Quatre lettres, quatre étapes, une roue qui ne s’arrête jamais : planifier, faire, vérifier, agir.", a: ["PDCA"], hint: "On m’appelle aussi la roue de Deming.", e: "Le PDCA (Plan-Do-Check-Act) est le cycle de base de l’amélioration continue." },
  { q: "D’origine japonaise, je rends l’erreur impossible… ou au moins immédiatement visible. Il ne faut jamais me contourner.", a: ["POKA-YOKE", "POKAYOKE", "DÉTROMPEUR"], hint: "En français, on m’appelle détrompeur.", e: "Un poka-yoke (détrompeur) empêche une erreur connue : une pièce qui ne rentre que dans le bon sens, un capteur…" },

en: [
  { q: "I am the thread that links every part to its history: without me, nobody knows where it came from or where it went.", a: ["TRACEABILITY"], hint: "The lot number makes me possible.", e: "Traceability lets you find a product’s history, use and location, especially in the event of a recall." },
  { q: "I have a ticket, an area and a red label, but I never travel until someone decides my fate.", a: ["QUARANTINE"], hint: "My name comes from a period of forty days.", e: "Quarantine isolates products awaiting a decision: nobody may use them or remove the label." },

  return pool[Math.floor(Math.random() * pool.length)];
}
function rpcError(e) {
  const m = String(e && (e.message || e.details || ""));
  if (/LEVEL_LOCKED/.test(m)) return t("locked");
  if (/ITEM_ALREADY_SEEN/.test(m)) return t("seen");
  if (/AUTH_REQUIRED/.test(m)) return t("expired");
  return t("server");
}

/* ---------- Accueil ---------- */
function dateLabel() { try { return new Date(day + "T12:00:00").toLocaleDateString(L === "en" ? "en-GB" : "fr-FR", { weekday: "long", day: "numeric", month: "long" }); } catch { return day; } }
function untilMidnight() {
  const p = new Intl.DateTimeFormat("fr-FR", { timeZone: "Europe/Paris", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" }).formatToParts(new Date());
  const g = k => Number(p.find(x => x.type === k)?.value || 0);
  const left = 86400 - (g("hour") * 3600 + g("minute") * 60 + g("second"));
  return `${Math.floor(left / 3600)} h ${String(Math.floor(left % 3600 / 60)).padStart(2, "0")} min`;
}
function renderHome(msg = "", cls = "") {
  view = "home"; clearInterval(clockT);
  const doneAll = LEVELS.every(Lv => today[Lv.n]?.finished);
  const dayScore = LEVELS.reduce((a, Lv) => a + (today[Lv.n]?.finished ? Number(today[Lv.n].score) || 0 : 0), 0);
  app.innerHTML = `
    <h1>${t("title")}</h1>
    <p class="muted dateline">${esc(dateLabel())}</p>
    <div class="total"><div><span class="small">${t("today")}</span><b>${dayScore} / 1000</b></div><div><span class="small">${t("totalHub")}</span><b>${total}</b></div>${doneAll ? `<div><span class="small">${t("nextIn")}</span><b id="clock">${untilMidnight()}</b></div>` : ""}</div>
    <div class="levels">${LEVELS.map(Lv => {
      const r = today[Lv.n], prevDone = Lv.n === 1 || today[Lv.n - 1]?.finished, done = r?.finished, started = r && !done;
      return `<article class="card level ${done ? "done" : ""} ${!prevDone ? "locked" : ""}">
        <div class="row between"><span class="num" aria-hidden="true">${done ? "✓" : Lv.n}</span><span class="small muted">${t("upTo", { n: Lv.max })}</span></div>
        <h2>${t("levelN", { n: Lv.n, name: Lv.name })}</h2><p class="small">${Lv.desc}</p>
        <p class="st">${done ? t("doneScore", { n: Number(r.score) || 0 }) : started ? t("inProgress") : prevDone ? t("availableL") : t("lockedL")}</p>
        ${done ? `<button class="btn" type="button" disabled>${t("tomorrow")}</button>` : `<button class="btn primary" type="button" data-action="play" data-n="${Lv.n}" ${prevDone && !busy ? "" : "disabled"}>${started ? t("resume") : t("play")} →</button>`}
      </article>`; }).join("")}</div>
    <p class="warn" style="margin-top:16px">${t("rules")}</p>
    <p class="status ${cls}" role="status">${esc(msg)}</p>`;
  if (doneAll) clockT = setInterval(() => { const c = document.getElementById("clock"); if (c) c.textContent = untilMidnight(); }, 30000);
}
async function play(n) {
  if (busy) return;
  busy = true; renderHome(t("preparing"));
  try {
    const existing = today[n];
    const item = existing ? Number(existing.item) : pickItem(n);
    const r = await window.QWScores.rpc("start_daily_level", { p_level: n, p_item: item });
    today[n] = { level: n, item: Number(r.item), score: r.score, finished: !!r.finished };
    busy = false;
    if (today[n].finished) { renderHome(); return; }
    const ls = loadLS(n);
    if (ls && ls.item === today[n].item && ls.done) { await finish(n, ls.score, ls); return; }
    [null, startRiddle, startHangman, startCrossword][n](today[n].item, ls && ls.item === today[n].item ? ls : null);
  } catch (e) { console.error(e); busy = false; renderHome(rpcError(e), "err"); }
}
async function finish(n, score, st) {
  st.done = true; st.score = score; saveLS(n, st);
  const el = document.getElementById("finishStatus");
  if (el) { el.className = "status"; el.textContent = t("saving"); }
  try {
    const r = await window.QWScores.rpc("finish_daily_level", { p_level: n, p_score: score });
    total = Number(r.total) || total; today[n] = Object.assign(today[n] || {}, { finished: true, score: Number(r.score) });
    if (el) { el.className = "status ok"; el.textContent = t("savedOk", { n: total }); const nb = document.getElementById("nextBtn"); if (nb) nb.disabled = false; }
    else renderHome(t("savedShort"), "ok");
  } catch (e) {
    console.error(e);
    if (el) { el.className = "status err"; el.innerHTML = `${esc(rpcError(e))} <button class="btn" type="button" data-action="retry" data-n="${n}">${t("retry")}</button>`; }
    else renderHome(rpcError(e), "err");
  }
}
function resultHTML(n, score, title, body) {
  const next = LEVELS[n];
  return `<section class="card result" style="margin-top:16px">
    <p class="eyebrow">${t("levelU", { n, name: LEVELS[n - 1].name.toUpperCase() })}</p><h2>${esc(title)}</h2>
    <p class="pts">${score}<span style="font-size:20px"> / ${LEVELS[n - 1].max} pts</span></p>
    <div class="explain" style="margin:14px 0">${body}</div>
    <p class="status" id="finishStatus" role="status"></p>
    <div class="row" style="justify-content:center">${next ? `<button class="btn primary" type="button" id="nextBtn" data-action="play" data-n="${next.n}" disabled>${t("nextLevel", { n: next.n, name: next.name })}</button>` : ""}<button class="btn" type="button" data-action="home">${t("backDay")}</button></div>
  </section>`;
}

/* ---------- Niveau 1 : énigme (200 pts) ---------- */
function startRiddle(item, st) {
  view = "riddle";
  const R = RD[item];
  st = st || { item, tries: 0, hint: false, wrong: [] };
  saveLS(1, st);
  const first = R.a[0];
  const render = (msg = "") => {
    const left = 3 - st.tries;
    app.innerHTML = `<section class="card" style="margin-top:16px">
      <div class="row between"><span class="eyebrow">${t("rdLabel")}</span><span class="lives" aria-label="${t("triesLeft", { n: left })}">${"●".repeat(left)}${"○".repeat(3 - left)}</span></div>
      <p class="riddle">${esc(R.q)}</p>
      <p class="small muted">${t("expectedLen", { n: norm(first).length })}</p>
      <div class="pattern" aria-hidden="true">${Array.from(first).map(ch => /[\s-]/.test(ch) ? `<span class="gap"></span>` : `<span></span>`).join("")}</div>
      ${st.hint ? `<p class="warn">${esc(t("hintTxt", { h: R.hint }))}</p>` : ""}
      <form id="rf" class="row" autocomplete="off"><label class="sr" for="ans">${t("yourAnswer")}</label><input id="ans" class="answer" maxlength="40" autocapitalize="characters" spellcheck="false" placeholder="${t("yourAnswer")}" style="flex:1 1 260px" required>
      <button class="btn primary" type="submit">${t("validate")}</button></form>
      <div class="row" style="margin-top:12px"><button class="btn" type="button" id="hintBtn" ${st.hint ? "disabled" : ""}>${t("hintBtn")}</button><span class="small muted">${t("ignore")}</span></div>
      ${st.wrong.length ? `<p class="small" style="margin-top:12px">${t("already")} ${st.wrong.map(w => `<s>${esc(w)}</s>`).join(", ")}</p>` : ""}
      <p class="status err" role="alert">${esc(msg)}</p></section>`;
    const input = document.getElementById("ans"); input.focus();
    document.getElementById("hintBtn").onclick = () => { st.hint = true; saveLS(1, st); render(); };
    document.getElementById("rf").onsubmit = e => {
      e.preventDefault();
      const v = input.value.trim(); if (!norm(v)) return;
      if (R.a.some(a => norm(a) === norm(v))) return end(true);
      st.tries++; st.wrong.push(v); saveLS(1, st);
      if (st.tries >= 3) return end(false);
      render(t("notIt", { n: 3 - st.tries }));
    };
  };
  const end = ok => {
    view = "result";
    const score = ok ? Math.max(30, 200 - st.tries * 50 - (st.hint ? 40 : 0)) : 0;
    app.innerHTML = resultHTML(1, score, ok ? t("rdOk") : t("rdKo"), `<p><b>${esc(t("answerIs", { a: first }))}</b></p><p style="margin:0">${esc(R.e)}</p>`);
    finish(1, score, st);
  };
  render();
}

/* ---------- Niveau 2 : pendu (300 pts) ---------- */
const MAX_ERR = 7;
function gallows(err) {
  const parts = [`<line x1="20" y1="230" x2="180" y2="230"/>`, `<line x1="50" y1="230" x2="50" y2="20"/><line x1="50" y1="20" x2="140" y2="20"/>`, `<line x1="140" y1="20" x2="140" y2="50"/>`,
    `<circle cx="140" cy="70" r="20"/>`, `<line x1="140" y1="90" x2="140" y2="150"/>`, `<line x1="140" y1="105" x2="115" y2="130"/><line x1="140" y1="105" x2="165" y2="130"/>`, `<line x1="140" y1="150" x2="118" y2="190"/><line x1="140" y1="150" x2="162" y2="190"/>`];
  return `<svg viewBox="0 0 200 250" role="img" aria-label="${t("gallowsAria", { n: err, m: MAX_ERR })}"><g stroke="#111" stroke-width="6" stroke-linecap="round" fill="none">${parts.slice(0, err).join("")}</g>${err >= MAX_ERR ? `<text x="100" y="245" text-anchor="middle" font-size="16" font-weight="900" fill="#a40000">${t("lost")}</text>` : ""}</svg>`;
}
function startHangman(item, st) {
  view = "hangman";
  const H = HG[item], W = H.w;
  st = st || { item, guessed: [] };
  saveLS(2, st);
  const errors = () => st.guessed.filter(l => !W.includes(l)).length;
  const won = () => [...W].every(l => st.guessed.includes(l));
  const render = () => {
    const err = errors(), over = won() || err >= MAX_ERR;
    app.innerHTML = `<section class="card" style="margin-top:16px">
      <div class="row between"><span class="eyebrow">${t("hgLabel")}</span><span class="small" aria-live="polite">${t("errors", { n: err, m: MAX_ERR })}</span></div>
      <div class="hang">${gallows(err)}<div>
        <p><b>${t("clue")}</b> ${esc(H.c)}</p>
        <div class="word" aria-label="${t("wordAria", { n: W.length })}">${[...W].map(l => `<span class="${over && !st.guessed.includes(l) ? "miss" : ""}">${st.guessed.includes(l) || over ? l : ""}</span>`).join("")}</div>
        <p class="small muted">${t("hgHelp", { n: W.length })}</p>
      </div></div>
      <div class="keys" role="group" aria-label="${t("letters")}">${"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(l => { const g = st.guessed.includes(l); return `<button type="button" class="key ${g ? (W.includes(l) ? "hit" : "miss") : ""}" data-l="${l}" ${g || over ? "disabled" : ""} aria-label="${t("letterAria", { l })}">${l}</button>`; }).join("")}</div>
    </section>`;
    app.querySelectorAll(".key").forEach(b => b.onclick = () => guess(b.dataset.l));
  };
  const guess = l => {
    if (view !== "hangman" || st.guessed.includes(l)) return;
    st.guessed.push(l); saveLS(2, st);
    if (won() || errors() >= MAX_ERR) return end();
    render(); app.querySelector(".key:not(:disabled)")?.focus({ preventScroll: true });
  };
  const end = () => {
    view = "result";
    document.removeEventListener("keydown", onKey);
    const ok = won(), err = errors(), score = ok ? Math.max(40, 300 - err * 35) : 0;
    app.innerHTML = resultHTML(2, score, ok ? t("hgOk") : t("hgKo"), `<p><b>${esc(t("wordWas", { w: W }))}</b></p><p style="margin:0">${esc(H.c)}. ${ok ? t("withErr", { n: err }) : ""}</p>`);
    finish(2, score, st);
  };
  const onKey = e => { if (view !== "hangman" || e.ctrlKey || e.metaKey || e.altKey) return; const l = norm(e.key); if (/^[A-Z]$/.test(l)) { e.preventDefault(); guess(l); } };
  document.addEventListener("keydown", onKey);
  render();
}

/* ---------- Niveau 3 : mots croisés (500 pts) ---------- */
function startCrossword(item, st) {
  view = "crossword";
  const G = GR[item], H = G.h, Wd = G.w;
  const sol = {};
  G.entries.forEach(e => { [...e.w].forEach((ch, i) => { sol[`${e.r + (e.d === "D" ? i : 0)},${e.c + (e.d === "A" ? i : 0)}`] = ch; }); });
  let num = 0; const numbers = {};
  for (let r = 0; r < H; r++) for (let c = 0; c < Wd; c++) if (G.entries.some(e => e.r === r && e.c === c)) numbers[`${r},${c}`] = ++num;
  const entries = G.entries.map(e => ({ ...e, num: numbers[`${e.r},${e.c}`], cells: [...e.w].map((_, i) => `${e.r + (e.d === "D" ? i : 0)},${e.c + (e.d === "A" ? i : 0)}`) }));
  st = st || { item, fill: {}, reveals: [] };
  saveLS(3, st);
  let cur = entries[0], pos = cur.cells[0];
  const cs = `min(${Math.floor(560 / Math.max(H, Wd))}px, calc((100vw - ${84 + (Wd - 1) * 2}px) / ${Wd}))`;
  const across = entries.filter(e => e.d === "A").sort((a, b) => a.num - b.num), down = entries.filter(e => e.d === "D").sort((a, b) => a.num - b.num);
  const solved = e => e.cells.every(k => (st.fill[k] || "") === sol[k]);
  app.innerHTML = `<section class="card" style="margin-top:16px">
    <div class="row between"><span class="eyebrow">${t("cwLabel")}</span><span class="small">${t("cells", { n: Object.keys(sol).length })}</span></div>
    <p class="small muted">${t("cwHelp")}</p>
    <div class="curClue" id="curClue" aria-live="polite"></div>
    <div class="cw">
      <div class="grid" id="grid" style="--cs:${cs};grid-template-columns:repeat(${Wd},var(--cs))">${Array.from({ length: H * Wd }, (_, i) => { const r = Math.floor(i / Wd), c = i % Wd, k = `${r},${c}`; return sol[k] ? `<div class="cell on" data-k="${k}">${numbers[k] ? `<span class="n">${numbers[k]}</span>` : ""}<input maxlength="2" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="${t("cellAria", { r: r + 1, c: c + 1 })}" data-k="${k}"></div>` : `<div class="cell"></div>`; }).join("")}</div>
      <div class="clues"><div><h3>${t("across")}</h3><ol>${across.map(e => `<li data-e="${entries.indexOf(e)}" tabindex="0" role="button"><b>${e.num}.</b> ${esc(e.clue)} <span class="muted">(${e.w.length})</span></li>`).join("")}</ol></div>
      <div><h3>${t("down")}</h3><ol>${down.map(e => `<li data-e="${entries.indexOf(e)}" tabindex="0" role="button"><b>${e.num}.</b> ${esc(e.clue)} <span class="muted">(${e.w.length})</span></li>`).join("")}</ol></div></div>
    </div>
    <div class="row" style="margin-top:16px"><button class="btn" type="button" id="reveal"></button><button class="btn primary" type="button" id="validate">${t("validateGrid")}</button></div>
    <p class="status" id="cwStatus" role="status"></p></section>`;
  const grid = document.getElementById("grid");
  const input = k => grid.querySelector(`input[data-k="${k}"]`);
  const paint = () => {
    grid.querySelectorAll(".cell.on").forEach(c => { const k = c.dataset.k; c.classList.toggle("inword", cur.cells.includes(k)); c.classList.toggle("cur", k === pos); c.classList.toggle("rev", st.reveals.includes(k)); const v = st.fill[k] || ""; const inp = c.querySelector("input"); if (inp.value !== v) inp.value = v; inp.readOnly = st.reveals.includes(k); });
    app.querySelectorAll(".clues li").forEach(li => { const e = entries[+li.dataset.e]; li.classList.toggle("cur", e === cur); li.classList.toggle("ok", solved(e)); });
    const rb = document.getElementById("reveal"); rb.textContent = t("reveal", { n: 3 - st.reveals.length }); rb.disabled = st.reveals.length >= 3;
    const cc = document.getElementById("curClue"); if (cc) cc.innerHTML = `<b>${cur.num}. ${cur.d === "A" ? t("across") : t("down")}</b> — ${esc(cur.clue)} <span class="muted">(${cur.w.length})</span>`;
  };
  const focus = k => { pos = k; paint(); input(k)?.focus(); };
  const entryFor = (k, d) => entries.find(e => e.d === d && e.cells.includes(k));
  const select = k => {
    if (k === pos && entryFor(k, cur.d === "A" ? "D" : "A") && cur.cells.includes(k)) cur = entryFor(k, cur.d === "A" ? "D" : "A");
    else if (!cur.cells.includes(k)) cur = entryFor(k, cur.d) || entryFor(k, cur.d === "A" ? "D" : "A");
    focus(k);
  };
  const step = dir => { const i = cur.cells.indexOf(pos) + dir; if (i >= 0 && i < cur.cells.length) focus(cur.cells[i]); };
  grid.addEventListener("mousedown", e => { const c = e.target.closest(".cell.on"); if (c) { e.preventDefault(); select(c.dataset.k); } });
  grid.addEventListener("focusin", e => { const k = e.target.dataset?.k; if (k && k !== pos) { if (!cur.cells.includes(k)) cur = entryFor(k, cur.d) || entryFor(k, cur.d === "A" ? "D" : "A"); pos = k; paint(); } });
  grid.addEventListener("input", e => {
    const k = e.target.dataset.k; if (!k) return;
    if (st.reveals.includes(k)) { e.target.value = st.fill[k]; return; }
    const v = norm(e.target.value).replace(/[0-9]/g, "").slice(-1);
    st.fill[k] = v; e.target.value = v; saveLS(3, st);
    if (v) step(1); else paint();
  });
  grid.addEventListener("keydown", e => {
    const k = e.target.dataset?.k; if (!k) return;
    const [r, c] = k.split(",").map(Number);
    const mv = { ArrowLeft: [0, -1, "A"], ArrowRight: [0, 1, "A"], ArrowUp: [-1, 0, "D"], ArrowDown: [1, 0, "D"] }[e.key];
    if (mv) { e.preventDefault(); const nk = `${r + mv[0]},${c + mv[1]}`; if (sol[nk]) { cur = entryFor(nk, mv[2]) || entryFor(nk, mv[2] === "A" ? "D" : "A"); focus(nk); } return; }
    if (e.key === "Backspace" && !e.target.value) { e.preventDefault(); step(-1); if (!st.reveals.includes(pos)) { st.fill[pos] = ""; saveLS(3, st); paint(); } return; }
    if (/^[a-zA-ZÀ-ÿ]$/.test(e.key) && !st.reveals.includes(k)) { e.preventDefault(); st.fill[k] = norm(e.key); saveLS(3, st); step(1); paint(); }
  });
  const pickClue = li => { cur = entries[+li.dataset.e]; focus(cur.cells.find(k => !st.fill[k]) || cur.cells[0]); };
  app.querySelectorAll(".clues li").forEach(li => { li.addEventListener("click", () => pickClue(li)); li.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pickClue(li); } }); });
  document.getElementById("reveal").onclick = () => {
    if (st.reveals.length >= 3) return;
    const k = cur.cells.find(x => (st.fill[x] || "") !== sol[x]) || Object.keys(sol).find(x => (st.fill[x] || "") !== sol[x]);
    if (!k) return;
    st.fill[k] = sol[k]; st.reveals.push(k); saveLS(3, st); focus(k);
  };
  document.getElementById("validate").onclick = () => {
    const keys = Object.keys(sol), empty = keys.filter(k => !st.fill[k]).length;
    if (empty && !confirm(t("confirmEmpty", { n: empty }))) return;
    if (!empty && !confirm(t("confirmFull"))) return;
    const good = keys.filter(k => st.fill[k] === sol[k]).length;
    const score = Math.max(0, Math.round(500 * good / keys.length) - 30 * st.reveals.length);
    view = "result";
    grid.querySelectorAll(".cell.on").forEach(c => { const k = c.dataset.k; const i = c.querySelector("input"); i.value = sol[k]; i.readOnly = true; c.classList.remove("inword", "cur"); c.classList.add(st.fill[k] === sol[k] ? "good" : "bad"); });
    const gridHTML = grid.outerHTML.replace('id="grid"', "");
    app.innerHTML = resultHTML(3, score, good === keys.length ? t("cwPerfect") : t("cwDone"), `<p>${t("cwRes", { g: good, t: keys.length })}${st.reveals.length ? t("revealed", { n: st.reveals.length }) : ""}. ${t("cwLegend")}</p><div style="display:flex;justify-content:center;overflow:auto">${gridHTML}</div>`);
    finish(3, score, st);
  };
  paint();
  focus(cur.cells.find(k => !st.fill[k]) || cur.cells[0]);
}

/* ---------- Actions ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-action]"); if (!b || b.disabled) return;
  const a = b.dataset.action;
  if (a === "play") play(+b.dataset.n);
  if (a === "home") renderHome();
  if (a === "retry") { const n = +b.dataset.n, st = loadLS(n); if (st) finish(n, st.score, st); }
});

window.addEventListener("DOMContentLoaded", async () => {
  if (!window.QWScores) { app.innerHTML = `<p class="status err">${t("server")}</p>`; return; }
  const ready = await window.QWScores.boot("daily");
  if (!ready) return;
  user = ready.user;
  try {
    await refresh();
    for (const Lv of LEVELS) { const r = today[Lv.n]; if (r && !r.finished) { const ls = loadLS(Lv.n); if (ls && ls.done && ls.item === Number(r.item)) await finish(Lv.n, ls.score, ls); } }
    renderHome();
  } catch (e) {
    window.QWScores.showLoadError(e, t("notConfigured"));
  }
}, { once: true });
})();
</script>
</body>
</html>
